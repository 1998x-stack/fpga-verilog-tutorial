<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-labelledby="a27t a27d">
  <title id="a27t">LLM 生成 RTL 的检查关</title>
  <desc id="a27d">LLM 生成的 RTL 依次经过五道检查：lint 与可综合性、单元仿真、跨时钟域审查、综合实现与时序报告、可选的形式或等价检查。任一关失败都退回修改；全部通过后由人签收。检查关按先便宜后昂贵的顺序排列。</desc>
  <rect width="980" height="470" fill="#fffdf9"/>
  <text x="40" y="42" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">AI 生成只是代码来源，不代替验证</text>
  <g font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" text-anchor="middle">
    <rect x="30" y="90" width="150" height="72" rx="12" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/>
    <text x="105" y="122" font-size="14" font-weight="750" fill="#203035">LLM 生成</text>
    <text x="105" y="144" font-size="12" fill="#566066">RTL / Tcl / TB</text>

    <rect x="210" y="90" width="140" height="72" rx="10" fill="#eef7f6" stroke="#147f80" stroke-width="1.5"/>
    <text x="280" y="120" font-size="13" font-weight="750" fill="#203035">lint / 可综合</text>
    <text x="280" y="142" font-size="11.5" fill="#566066">语法、位宽、驱动</text>

    <rect x="380" y="90" width="140" height="72" rx="10" fill="#eef7f6" stroke="#147f80" stroke-width="1.5"/>
    <text x="450" y="120" font-size="13" font-weight="750" fill="#203035">单元仿真</text>
    <text x="450" y="142" font-size="11.5" fill="#566066">定向 testbench</text>

    <rect x="550" y="90" width="150" height="72" rx="10" fill="#fff4ed" stroke="#c6674b" stroke-width="2"/>
    <text x="625" y="120" font-size="13" font-weight="750" fill="#203035">CDC 审查</text>
    <text x="625" y="142" font-size="11.5" fill="#c6674b">同步级数 / 握手</text>

    <rect x="730" y="90" width="150" height="72" rx="10" fill="#fbf4dd" stroke="#9c742c" stroke-width="1.5"/>
    <text x="805" y="120" font-size="13" font-weight="750" fill="#203035">实现与时序</text>
    <text x="805" y="142" font-size="11.5" fill="#566066">WNS/TNS 报告</text>

    <path d="M180 126H206" stroke="#7564b8" stroke-width="2.5"/>
    <path d="M350 126H376" stroke="#147f80" stroke-width="2.5"/>
    <path d="M520 126H546" stroke="#147f80" stroke-width="2.5"/>
    <path d="M700 126H726" stroke="#c6674b" stroke-width="2.5"/>

    <rect x="230" y="230" width="520" height="60" rx="10" fill="#ffffff" stroke="#203035" stroke-width="1.5"/>
    <text x="490" y="256" font-size="13.5" font-weight="750" fill="#203035">可选：形式验证 / 与参考实现等价比较</text>
    <text x="490" y="276" font-size="12" fill="#566066">控制逻辑适合；数据通路成本高</text>

    <path d="M625 162V226" stroke="#c6674b" stroke-width="2.5" stroke-dasharray="5 4"/>
    <path d="M625 226l-6-10h12z" fill="#c6674b"/>

    <rect x="300" y="340" width="380" height="70" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2.5"/>
    <text x="490" y="370" font-size="15" font-weight="750" fill="#203035">人工签收</text>
    <text x="490" y="392" font-size="12" fill="#566066">任一关失败 → 退回修改；验证责任不由模型承担</text>

    <path d="M490 290V336" stroke="#147f80" stroke-width="2.5"/>
    <path d="M490 336l-6-10h12z" fill="#147f80"/>
  </g>
</svg>
