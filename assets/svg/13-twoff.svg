<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="13twofft 13twoffd"><title id="13twofft">两级同步器降低单比特亚稳态传播风险</title><desc id="13twoffd">异步源信号先进入第一个接收域触发器，再由第二个接收域触发器采样；只适合慢变化单 bit 电平，不能直接保证短脉冲一定捕获或多位数据一致。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="35" y="43" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#203035">2FF 同步器：延长收敛时间，而不是消灭亚稳态</text>
<rect x="49" y="122" width="206" height="234" rx="12" fill="#fbf4dd" stroke="#9c742c" stroke-width="2"/><text x="152" y="170" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#9c742c">源时钟域</text><text x="152" y="228" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="21" font-weight="500" text-anchor="middle" fill="#203035">async level</text>
<rect x="359" y="122" width="219" height="234" rx="12" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="467" y="170" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#7564b8">第一级 FF</text><text x="467" y="215" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">接收 clk ↑</text><text x="467" y="268" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#c6674b">可能亚稳态</text>
<rect x="682" y="122" width="222" height="234" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="793" y="170" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="middle" fill="#147f80">第二级 FF</text><text x="793" y="215" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">接收 clk ↑</text><text x="793" y="268" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#147f80">同步后输出</text>
<path d="M255 245H358" stroke="#9c742c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M578 245H681" stroke="#147f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" />
<text x="460" y="397" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#203035">两个 FF 都在接收域时钟边沿采样；请标记 ASYNC_REG 并控制级间路径。</text>
<text x="41" y="464" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#58686e">同步短脉冲、多位总线或保证原子更新需要额外机制；RTL 仿真不能模拟真实 MTBF。</text>
</svg>
