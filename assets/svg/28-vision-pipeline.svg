<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="v28t v28d">
  <title id="v28t">摄像头到显示的视觉流水线</title>
  <desc id="v28d">摄像头经 DVP 把像素送到采集模块（PCLK 域），写入 DDR 帧缓存；处理模块从帧缓存读出像素，在像素时钟域做灰度与 Sobel，输出边缘图；显示模块在像素时钟域按扫描时序从帧缓存读出像素并输出 RGB 与同步信号。采集、内存与显示之间的边界需要异步 FIFO 或握手跨越时钟域。</desc>
  <rect width="980" height="500" fill="#fffdf9"/>
  <text x="40" y="42" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">四个模块，三段跨时钟域边界</text>
  <g font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" text-anchor="middle">
    <rect x="30" y="120" width="150" height="80" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/>
    <text x="105" y="152" font-size="14" font-weight="750" fill="#203035">摄像头</text>
    <text x="105" y="174" font-size="11.5" fill="#566066">DVP + SCCB</text>

    <rect x="220" y="120" width="170" height="80" rx="12" fill="#eef7f6" stroke="#147f80" stroke-width="2"/>
    <text x="305" y="152" font-size="14" font-weight="750" fill="#203035">采集 capture</text>
    <text x="305" y="174" font-size="11.5" fill="#566066">PCLK 域 · 像素打包</text>

    <rect x="430" y="100" width="200" height="120" rx="12" fill="#fbf4dd" stroke="#9c742c" stroke-width="2"/>
    <text x="530" y="134" font-size="14" font-weight="750" fill="#203035">帧缓存</text>
    <text x="530" y="156" font-size="11.5" fill="#566066">DDR / Block RAM</text>
    <text x="530" y="176" font-size="11.5" fill="#9c742c">乒乓缓冲 A / B</text>
    <text x="530" y="198" font-size="11.5" fill="#566066">内存时钟域</text>

    <rect x="670" y="120" width="180" height="80" rx="12" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/>
    <text x="760" y="152" font-size="14" font-weight="750" fill="#203035">处理 process</text>
    <text x="760" y="174" font-size="11.5" fill="#566066">灰度 + Sobel</text>

    <rect x="670" y="300" width="180" height="80" rx="12" fill="#eef7f6" stroke="#147f80" stroke-width="2"/>
    <text x="760" y="332" font-size="14" font-weight="750" fill="#203035">显示 display</text>
    <text x="760" y="354" font-size="11.5" fill="#566066">扫描时序 → 屏幕</text>

    <path d="M180 160H216" stroke="#147f80" stroke-width="2.5"/>
    <path d="M216 160l-10-6v12z" fill="#147f80"/>
    <path d="M390 150H426" stroke="#c6674b" stroke-width="3"/>
    <path d="M426 150l-10-6v12z" fill="#c6674b"/>
    <path d="M630 150H666" stroke="#c6674b" stroke-width="3"/>
    <path d="M666 150l-10-6v12z" fill="#c6674b"/>
    <path d="M630 190H600V330H666" stroke="#c6674b" stroke-width="3" fill="none"/>
    <path d="M666 330l-10-6v12z" fill="#c6674b"/>

    <text x="408" y="128" font-size="11" fill="#c6674b">CDC</text>
    <text x="648" y="128" font-size="11" fill="#c6674b">CDC</text>
    <text x="612" y="262" font-size="11" fill="#c6674b">CDC</text>
  </g>
  <rect x="40" y="410" width="900" height="60" rx="12" fill="#ffffff" stroke="#203035" stroke-width="1.5"/>
  <text x="490" y="436" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13.5" font-weight="750" text-anchor="middle" fill="#203035">采集、内存、显示时钟不同 → 边界必须用异步 FIFO 或握手</text>
  <text x="490" y="458" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12" text-anchor="middle" fill="#566066">乒乓切换的多比特指针也要跨域同步（第 13 章），不能各域各取一次。</text>
</svg>
