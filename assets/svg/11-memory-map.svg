<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="11memorymapt 11memorymapd"><title id="11memorymapt">FPGA 可选存储资源与使用侧重点</title><desc id="11memorymapd">寄存器、LUTRAM 和块RAM分别以微小状态、分布式查找以及成块容量为主。不同系列的实际容量和功能不同。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="40" y="48" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="start" fill="#203035">存储不是一种资源：容量、端口与延迟共同决定映射</text>
<rect x="32" y="105" width="280" height="270" rx="16" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="172" y="153" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#7564b8">寄存器 / FF</text><text x="172" y="194" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">少量状态</text><text x="172" y="231" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">易形成任意逻辑连接</text><rect x="98" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#7564b8" stroke-width="2"/><rect x="151" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#7564b8" stroke-width="2"/><rect x="204" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#7564b8" stroke-width="2"/><text x="172" y="352" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#7564b8">独立状态位</text><rect x="342" y="105" width="280" height="270" rx="16" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="482" y="153" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#147f80">分布式 RAM</text><text x="482" y="194" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">少量随机访问</text><text x="482" y="231" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">利用 LUT 资源</text><rect x="408" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><rect x="461" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><rect x="514" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="482" y="352" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#147f80">LUT 构成的数据单元</text><rect x="652" y="105" width="280" height="270" rx="16" fill="#fbeae3" stroke="#c6674b" stroke-width="2"/><text x="792" y="153" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#c6674b">Block RAM</text><text x="792" y="194" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">成块存储</text><text x="792" y="231" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">同步读、专用硬核</text><rect x="718" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#c6674b" stroke-width="2"/><rect x="771" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#c6674b" stroke-width="2"/><rect x="824" y="268" width="43" height="46" rx="6" fill="#fffdf9" stroke="#c6674b" stroke-width="2"/><text x="792" y="352" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#c6674b">BRAM 宏块示意</text>
<text x="40" y="442" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#58686e">何时推断 BRAM：同步读样式、深度/宽度与工具、器件有关；不能由 reg 数组声明保证。</text>
</svg>
