<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="12validstallt 12validstalld"><title id="12validstallt">流水线的 valid 位必须与数据同步延迟</title><desc id="12validstalld">三级流水线中的有效位 v0 v1 v2 和数据 s0 s1 result 必须成对前进；全局 CE 为0时一起保持，防止重复或错位消费。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="36" y="43" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="start" fill="#203035">让数据与 valid 一同前进；停顿时一起保持</text>
<rect x="43" y="108" width="272" height="237" rx="16" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="179" y="157" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="25" font-weight="750" text-anchor="middle" fill="#147f80">stage0</text><text x="179" y="214" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">s0 = x</text><rect x="86" y="252" width="187" height="53" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="179" y="284" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">v0 = in_valid</text><path d="M315 217H353" stroke="#147f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><rect x="353" y="108" width="272" height="237" rx="16" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="489" y="157" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="25" font-weight="750" text-anchor="middle" fill="#7564b8">stage1</text><text x="489" y="214" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">s1 = s0 + 7</text><rect x="396" y="252" width="187" height="53" rx="8" fill="#fffdf9" stroke="#7564b8" stroke-width="2"/><text x="489" y="284" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#7564b8">v1 = v0</text><path d="M625 217H663" stroke="#147f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><rect x="663" y="108" width="272" height="237" rx="16" fill="#fbeae3" stroke="#c6674b" stroke-width="2"/><text x="799" y="157" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="25" font-weight="750" text-anchor="middle" fill="#c6674b">stage2</text><text x="799" y="214" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">out = s1 × 3</text><rect x="706" y="252" width="187" height="53" rx="8" fill="#fffdf9" stroke="#c6674b" stroke-width="2"/><text x="799" y="284" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#c6674b">v2 = v1</text>
<path d="M130 377H824" stroke="#9c742c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><text x="477" y="407" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#9c742c">ce=0 时全部寄存级保持；消费端也不能重复接收</text>
<text x="41" y="469" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">若采用 ready/valid 握手，需要定义何时算成功传输；该示例仅有全局 ce 而不是完整 AXI-Stream。</text>
</svg>
