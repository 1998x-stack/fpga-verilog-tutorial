<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="qsf-sdc-title qsf-sdc-desc"><title id="qsf-sdc-title">QSF 与 SDC 回答不同的问题</title><desc id="qsf-sdc-desc">QSF 管理工程、器件和实现分配；SDC 描述时钟、输入输出延迟与时序例外。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">QSF 与 SDC 回答不同的问题</text><rect x="70" y="120" width="340" height="245" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="240" y="150" text-anchor="middle" class="label">QSF · 工程事实</text><text x="240" y="176" text-anchor="middle" class="small">器件 / 顶层 / 源文件 / 管脚</text><rect x="550" y="120" width="340" height="245" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="720" y="150" text-anchor="middle" class="label">SDC · 时间模型</text><text x="720" y="176" text-anchor="middle" class="small">create_clock / I/O delay / generated clock</text><path d="M410 240 L475 240" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="442.5" y="231" text-anchor="middle" class="tiny">工程输入</text><path d="M550 280 L485 280" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="517.5" y="271" text-anchor="middle" class="tiny">时序输入</text><rect x="355" y="405" width="250" height="78" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="480" y="435" text-anchor="middle" class="label">Compiler + TimeQuest</text><text x="480" y="461" text-anchor="middle" class="small">按器件与约束实现</text><path d="M240 365 L400 405" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 365 L560 405" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="505" text-anchor="middle" class="small">管脚位置不是时钟周期；时钟周期也不能代替板级 I/O 延迟。</text></svg>
