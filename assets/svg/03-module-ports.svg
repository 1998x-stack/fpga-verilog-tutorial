<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="c01t c01d"><title id="c01t">模块、端口、net 与过程变量之间的关系</title><desc id="c01d">输入 a 和 b 经 wire 上的连续赋值构成 XOR，组合 always 产生 y 的 reg 变量。reg 是过程赋值目标，并不必然推断触发器。</desc><defs><marker id="c01arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="48" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="start" font-weight="750">HDL 名词不等于器件原语</text>
<rect x="135" y="101" width="690" height="280" rx="18" fill="#f8faf7" stroke="#c8d8d4" stroke-width="2"/><text x="166" y="138" font-family="system-ui,sans-serif" font-size="20" fill="#203035" text-anchor="start" font-weight="500">module xor_unit (a, b, y)</text>
<rect x="36" y="185" width="114" height="36" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="93" y="209" font-family="system-ui,sans-serif" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">input a</text><rect x="36" y="258" width="114" height="36" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="93" y="282" font-family="system-ui,sans-serif" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">input b</text>
<path d="M150 203H293V220H351" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c01arrow)"/>
<path d="M150 275H293V242H351" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c01arrow)"/>
<rect x="353" y="191" width="154" height="92" rx="15" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="430" y="224" font-family="system-ui,sans-serif" font-size="25" fill="#147f80" text-anchor="middle" font-weight="800">XOR</text><text x="430" y="253" font-family="system-ui,sans-serif" font-size="14" fill="#203035" text-anchor="middle" font-weight="500">assign w = a ^ b</text>
<path d="M507 236H588" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c01arrow)"/>
<rect x="592" y="191" width="195" height="92" rx="15" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="687" y="224" font-family="system-ui,sans-serif" font-size="21" fill="#203035" text-anchor="middle" font-weight="800">always @*</text><text x="687" y="251" font-family="system-ui,sans-serif" font-size="17" fill="#d06d4d" text-anchor="middle" font-weight="500">y = w;</text>
<path d="M790 236H918" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c01arrow)"/>
<text x="836" y="215" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="start" font-weight="500">output y</text>
<text x="160" y="349" font-family="system-ui,sans-serif" font-size="17" fill="#147f80" text-anchor="start" font-weight="500">wire w：网络由连续赋值驱动</text>
<text x="518" y="349" font-family="system-ui,sans-serif" font-size="17" fill="#d06d4d" text-anchor="start" font-weight="500">reg y：过程赋值目标，依然可为组合逻辑</text>
<text x="41" y="448" font-family="system-ui,sans-serif" font-size="18" fill="#53676d" text-anchor="start" font-weight="500">是否推断寄存器，取决于过程块的边沿触发和赋值完整性，而不是变量名 reg。</text>
</svg>
