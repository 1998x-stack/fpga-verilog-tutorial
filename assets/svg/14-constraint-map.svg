<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="14constraintmapt 14constraintmapd"><title id="14constraintmapt">STA的时钟、输入和输出边界</title><desc id="14constraintmapd">板上时钟通过FPGA输入端口进入clk，源同步外部数据需要set_input_delay约束，输出到外部设备的数据需要set_output_delay约束。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="39" y="45" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="start" fill="#203035">三个边界：时钟 / 输入 / 输出</text>
<rect x="37" y="118" width="245" height="232" rx="12" fill="#fbf4dd" stroke="#9c742c" stroke-width="2"/><text x="158" y="163" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#9c742c">外部发送设备</text><text x="158" y="214" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#203035">clock-to-out</text><text x="158" y="256" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">PCB data flight</text>
<rect x="359" y="88" width="273" height="291" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="495" y="133" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#147f80">FPGA 引脚与逻辑</text><text x="495" y="208" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#203035">get_ports din / dout</text><text x="495" y="254" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#7564b8">create_clock clk</text>
<rect x="706" y="118" width="215" height="232" rx="12" fill="#fbeae3" stroke="#c6674b" stroke-width="2"/><text x="814" y="163" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#c6674b">外部接收设备</text><text x="814" y="214" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">setup / hold</text><text x="814" y="256" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">PCB data flight</text>
<path d="M282 240H358" stroke="#9c742c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M632 240H705" stroke="#c6674b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" />
<text x="316" y="204" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#9c742c">-input</text><text x="668" y="204" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#c6674b">-output</text>
<text x="480" y="434" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#203035">-min 与 -max 均需来自接口参数、时钟相位和板级延迟的推导。</text>
<text x="40" y="477" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">切勿把外部设备的 tsetup 直接抄成 FPGA 的 input_delay，或凭空创建 generated_clock。</text>
</svg>
