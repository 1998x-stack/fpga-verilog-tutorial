<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ilacapture-title ilacapture-desc"><title id="ilacapture-title">ILA circular capture and trigger window</title><desc id="ilacapture-desc">The capture buffer stores pre-trigger samples, records the trigger event and then fills post-trigger samples before stopping.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">ILA 的核心不是“看全部信号”，而是抓住关键事件附近</text><text x="90" y="125" class="l">采样序列</text><rect x="90" y="165" width="42" height="75" rx="5" fill="#eef3fb" stroke="#9aaca5"/><text x="111" y="207" text-anchor="middle" class="s">0</text><rect x="139" y="165" width="42" height="75" rx="5" fill="#eef3fb" stroke="#9aaca5"/><text x="160" y="207" text-anchor="middle" class="s">1</text><rect x="188" y="165" width="42" height="75" rx="5" fill="#eef3fb" stroke="#9aaca5"/><text x="209" y="207" text-anchor="middle" class="s">2</text><rect x="237" y="165" width="42" height="75" rx="5" fill="#eef3fb" stroke="#9aaca5"/><text x="258" y="207" text-anchor="middle" class="s">3</text><rect x="286" y="165" width="42" height="75" rx="5" fill="#eef3fb" stroke="#9aaca5"/><text x="307" y="207" text-anchor="middle" class="s">4</text><rect x="335" y="165" width="42" height="75" rx="5" fill="#eef3fb" stroke="#9aaca5"/><text x="356" y="207" text-anchor="middle" class="s">5</text><rect x="384" y="165" width="42" height="75" rx="5" fill="#f6d8c8" stroke="#c18a39"/><text x="405" y="207" text-anchor="middle" class="s">6</text><rect x="433" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="454" y="207" text-anchor="middle" class="s">7</text><rect x="482" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="503" y="207" text-anchor="middle" class="s">8</text><rect x="531" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="552" y="207" text-anchor="middle" class="s">9</text><rect x="580" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="601" y="207" text-anchor="middle" class="s">10</text><rect x="629" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="650" y="207" text-anchor="middle" class="s">11</text><rect x="678" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="699" y="207" text-anchor="middle" class="s">12</text><rect x="727" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="748" y="207" text-anchor="middle" class="s">13</text><rect x="776" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="797" y="207" text-anchor="middle" class="s">14</text><rect x="825" y="165" width="42" height="75" rx="5" fill="#eaf5f0" stroke="#9aaca5"/><text x="846" y="207" text-anchor="middle" class="s">15</text><path d="M405 145 V260" stroke="#c18a39" stroke-width="3"/><text x="405" y="135" text-anchor="middle" class="l">Trigger</text><path d="M100 300 H385" stroke="#5378a8" stroke-width="5"/><path d="M410 300 H860" stroke="#43866b" stroke-width="5"/><text x="240" y="335" text-anchor="middle" class="s">Pre-trigger history</text><text x="640" y="335" text-anchor="middle" class="s">Post-trigger samples</text><rect x="95" y="390" width="770" height="75" rx="12" class="orange"/><text x="480" y="420" text-anchor="middle" class="l">Capture depth × probe width = raw sample storage</text><text x="480" y="448" text-anchor="middle" class="s">实际资源还包含比较器、控制逻辑、布线与时钟影响；以实现报告为准。</text></svg>
