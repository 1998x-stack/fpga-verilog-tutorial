<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hazards-title hazards-desc"><title id="hazards-title">Forwarding priority and load-use stall</title><desc id="hazards-desc">Forwarding selects EX/MEM before MEM/WB. A load-use dependency stalls the front of the pipeline for one cycle and inserts a bubble.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">RAW 冒险：能前推的直接旁路，不能前推的停一拍</text><rect x="45" y="110" width="240" height="95" rx="12" class="blue"/><text x="165" y="145" text-anchor="middle" class="l">EX/MEM</text><text x="165" y="177" text-anchor="middle" class="s">newer ALU result</text><rect x="45" y="250" width="240" height="95" rx="12" class="purple"/><text x="165" y="285" text-anchor="middle" class="l">MEM/WB</text><text x="165" y="317" text-anchor="middle" class="s">older write-back value</text><path d="M285 158 H405 V205 H500 M285 298 H440 V235 H500" class="line"/><rect x="500" y="155" width="170" height="110" rx="12" class="green"/><text x="585" y="195" text-anchor="middle" class="l">Forward MUX</text><text x="585" y="226" text-anchor="middle" class="s">10 wins over 01</text><path d="M670 210 H770" class="line"/><rect x="770" y="170" width="145" height="80" rx="12" class="orange"/><text x="842" y="203" text-anchor="middle" class="l">EX operand</text><text x="842" y="228" text-anchor="middle" class="s">rs1 / rs2</text><rect x="45" y="390" width="250" height="92" rx="12" class="orange"/><text x="170" y="426" text-anchor="middle" class="l">ID/EX: LW rd=5</text><text x="170" y="455" text-anchor="middle" class="s">load value not ready</text><rect x="390" y="390" width="250" height="92" rx="12" class="blue"/><text x="515" y="426" text-anchor="middle" class="l">IF/ID: uses rs1=5</text><text x="515" y="455" text-anchor="middle" class="s">dependency detected</text><path d="M295 436 H390" stroke="#c18a39" stroke-width="3" stroke-dasharray="7 5"/><text x="345" y="420" text-anchor="middle" class="xs">match</text><path d="M640 436 H755" stroke="#c18a39" stroke-width="3"/><text x="790" y="425" class="s">stall PC / IF-ID</text><text x="790" y="452" class="s">inject bubble</text></svg>
