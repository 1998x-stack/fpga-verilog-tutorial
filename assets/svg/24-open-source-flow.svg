<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ossflow-title ossflow-desc"><title id="ossflow-title">Open-source FPGA build flow</title><desc id="ossflow-desc">Verilator and Icarus support simulation and lint; Yosys synthesizes; nextpnr places and routes; family-specific packers create bitstreams.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">开源 FPGA 工具链：工具职责分层，器件后端不能混用</text><rect x="35" y="170" width="132" height="112" rx="12" class="blue"/><text x="101" y="210" text-anchor="middle" class="l">RTL</text><text x="101" y="245" text-anchor="middle" class="xs">Verilog / SV</text><rect x="188" y="170" width="132" height="112" rx="12" class="green"/><text x="254" y="210" text-anchor="middle" class="l">Verify</text><text x="254" y="245" text-anchor="middle" class="xs">Icarus / Verilator</text><rect x="341" y="170" width="132" height="112" rx="12" class="blue"/><text x="407" y="210" text-anchor="middle" class="l">Synthesis</text><text x="407" y="245" text-anchor="middle" class="xs">Yosys + ABC</text><rect x="494" y="170" width="132" height="112" rx="12" class="orange"/><text x="560" y="210" text-anchor="middle" class="l">P&amp;R</text><text x="560" y="245" text-anchor="middle" class="xs">nextpnr</text><rect x="647" y="170" width="132" height="112" rx="12" class="purple"/><text x="713" y="210" text-anchor="middle" class="l">Pack</text><text x="713" y="245" text-anchor="middle" class="xs">icepack / ecppack</text><rect x="800" y="170" width="132" height="112" rx="12" class="green"/><text x="866" y="210" text-anchor="middle" class="l">Program</text><text x="866" y="245" text-anchor="middle" class="xs">iceprog / openFPGALoader</text><path d="M167 226 H188" class="line"/><path d="M320 226 H341" class="line"/><path d="M473 226 H494" class="line"/><path d="M626 226 H647" class="line"/><path d="M779 226 H800" class="line"/><rect x="110" y="360" width="740" height="85" rx="12" class="orange"/><text x="480" y="395" text-anchor="middle" class="l">Family-specific device database + constraints</text><text x="480" y="423" text-anchor="middle" class="s">IceStorm / Trellis / Oxide / Apicula / Project X-Ray 等后端成熟度与能力不同</text><text x="480" y="495" text-anchor="middle" class="s">仿真通过 ≠ 综合通过 ≠ P&amp;R 通过 ≠ 板级功能验证。</text></svg>
