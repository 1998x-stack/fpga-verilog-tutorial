<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="11ramreadfirstt 11ramreadfirstd"><title id="11ramreadfirstt">同步 RAM 同址读写的读旧值示例</title><desc id="11ramreadfirstd">在同一时钟沿读写同一地址，read-first RTL 将该时刻之前的存储值放入 dout，写入后的值在下一次读时可见。仅描述所示模型，不概括所有双时钟碰撞。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="40" y="44" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#203035">单端口同步 RAM · 同址读写采用 READ_FIRST 语义</text>
<rect x="62" y="112" width="220" height="230" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="172" y="153" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">memory[2]</text><text x="172" y="207" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="26" font-weight="750" text-anchor="middle" fill="#203035">旧值 A5</text><text x="172" y="271" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#c6674b">写入值 3C</text>
<path d="M282 223H352" stroke="#147f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" />
<rect x="358" y="112" width="260" height="230" rx="12" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="488" y="152" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#7564b8">CLK ↑ 同时操作</text><text x="488" y="211" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#203035">dout ← 旧 memory[2]</text><text x="488" y="255" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#c6674b">memory[2] ← 3C</text>
<path d="M618 223H676" stroke="#147f80" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" />
<rect x="682" y="112" width="220" height="230" rx="12" fill="#fbeae3" stroke="#c6674b" stroke-width="2"/><text x="792" y="151" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#c6674b">沿之后</text><text x="792" y="212" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#203035">dout = A5</text><text x="792" y="266" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#203035">memory[2] = 3C</text>
<text x="41" y="413" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#58686e">同一端口的读旧值是 RTL 和存储器模式的契约；另一端口、异步双时钟碰撞需按原语手册重新核查。</text>
<text x="41" y="455" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">图中的 A5 / 3C 是示例测试数据，不是实际 FPGA 的测量结果。</text>
</svg>
