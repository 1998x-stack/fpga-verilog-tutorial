<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="axiwrite-title axiwrite-desc"><title id="axiwrite-title">AXI4-Lite Slave 必须汇合独立的 AW 与 W</title><desc id="axiwrite-desc">写地址和写数据分别缓存；两者都握手后执行寄存器写入，再通过 B 通道返回响应。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">AXI4-Lite Slave 必须汇合独立的 AW 与 W</text><rect x="35" y="125" width="190" height="90" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="130" y="155" text-anchor="middle" class="label">AW channel</text><text x="130" y="181" text-anchor="middle" class="small">AWADDR + AWVALID</text><rect x="35" y="300" width="190" height="90" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="130" y="330" text-anchor="middle" class="label">W channel</text><text x="130" y="356" text-anchor="middle" class="small">WDATA + WSTRB + WVALID</text><rect x="300" y="125" width="200" height="90" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="400" y="155" text-anchor="middle" class="label">Address buffer</text><text x="400" y="181" text-anchor="middle" class="small">独立等待 AW</text><rect x="300" y="300" width="200" height="90" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="400" y="330" text-anchor="middle" class="label">Data buffer</text><text x="400" y="356" text-anchor="middle" class="small">独立等待 W</text><path d="M225 170 L300 170" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M225 345 L300 345" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="210" width="170" height="100" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="665" y="240" text-anchor="middle" class="label">Join + decode</text><text x="665" y="266" text-anchor="middle" class="small">AW 已收 AND W 已收</text><path d="M500 170 L580 240" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 345 L580 280" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="210" width="125" height="100" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="862.5" y="240" text-anchor="middle" class="label">B response</text><text x="862.5" y="266" text-anchor="middle" class="small">BVALID / BRESP</text><path d="M750 260 L800 260" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="465" text-anchor="middle" class="small">BVALID 保持到 BREADY；不能把 AWREADY 和 WREADY 当作同一信号。</text></svg>
