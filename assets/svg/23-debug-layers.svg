<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="debuglayers-title debuglayers-desc"><title id="debuglayers-title">FPGA observability layers</title><desc id="debuglayers-desc">A progression from external one-bit indicators to embedded logic analyzers and JTAG-based control; each instrument observes different signals and time scales.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">先定位故障层，再选择观测工具</text><rect x="75" y="105" width="810" height="76" rx="12" class="blue"/><text x="105" y="135" class="l">1 · LED / GPIO</text><text x="360" y="135" class="s">少量状态位、复位与 lock</text><text x="105" y="160" class="xs">引脚可见；示波器 / 外部逻辑分析仪</text><rect x="75" y="201" width="810" height="76" rx="12" class="green"/><text x="105" y="231" class="l">2 · UART trace / counters</text><text x="360" y="231" class="s">事件计数、状态码、错误快照</text><text x="105" y="256" class="xs">低速文本与统计；需要自建通道</text><rect x="75" y="297" width="810" height="76" rx="12" class="orange"/><text x="105" y="327" class="l">3 · ILA / SignalTap</text><text x="360" y="327" class="s">内部总线、FSM、valid/ready、错误条件</text><text x="105" y="352" class="xs">按设计时钟采样；触发后上传 JTAG</text><rect x="75" y="393" width="810" height="76" rx="12" class="purple"/><text x="105" y="423" class="l">4 · VIO / JTAG-to-AXI</text><text x="360" y="423" class="s">慢速控制、寄存器读写、在线探测</text><text x="105" y="448" class="xs">JTAG 事务；不是纳秒级实时控制</text><text x="480" y="510" text-anchor="middle" class="s">ILA / SignalTap 的采样时钟必须属于被解释的时钟域；异步信号要先同步或明确跨域分析。</text></svg>
