<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="simflow-title simflow-desc"><title id="simflow-title">仿真工具的三个阶段</title><desc id="simflow-desc">源文件先编译，再展开设计层次，最后推进事件仿真时间并检查输出。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">仿真工具的三个阶段</text><rect x="40" y="150" width="185" height="125" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="132.5" y="180" text-anchor="middle" class="label">Source files</text><text x="132.5" y="206" text-anchor="middle" class="small">RTL + Testbench</text><rect x="285" y="150" width="185" height="125" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="377.5" y="180" text-anchor="middle" class="label">Compile · vlog</text><text x="377.5" y="206" text-anchor="middle" class="small">语法 / 语言模式</text><rect x="530" y="150" width="185" height="125" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="622.5" y="180" text-anchor="middle" class="label">Elaborate · vopt</text><text x="622.5" y="206" text-anchor="middle" class="small">实例 / 参数 / 绑定</text><rect x="775" y="150" width="145" height="125" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="847.5" y="180" text-anchor="middle" class="label">Simulate</text><text x="847.5" y="206" text-anchor="middle" class="small">run / events</text><path d="M225 210 L285 210" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 210 L530 210" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M715 210 L775 210" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><rect x="245" y="355" width="220" height="85" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="355" y="385" text-anchor="middle" class="label">Waveform</text><text x="355" y="411" text-anchor="middle" class="small">信号时序证据</text><rect x="495" y="355" width="220" height="85" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="605" y="385" text-anchor="middle" class="label">Assertions + Scoreboard</text><text x="605" y="411" text-anchor="middle" class="small">功能判定</text><path d="M845 275 L355 355" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M845 275 L605 355" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="490" text-anchor="middle" class="small">编译成功只说明语法与构建阶段通过，不等于功能正确。</text></svg>
