<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="frameband-title frameband-desc"><title id="frameband-title">Uncompressed 1080p RGB888 frame budget</title><desc id="frameband-desc">A 1920 by 1080 RGB888 frame contains 6220800 bytes. Two buffers require 12441600 bytes, and 60 fps continuous write plus read transfers at least 746496000 active pixel bytes per second.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="43" y="49" font-size="25" font-weight="700" text-anchor="start" fill="#24373c">1080p · RGB888 · 60 fps：裸像素只是带宽下界</text><rect x="62" y="142" width="251" height="128" rx="13" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="187.5" y="179" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">6,220,800 B</text><text x="187.5" y="210" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">one 1920×1080 frame</text><rect x="354" y="142" width="251" height="128" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="479.5" y="179" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">12,441,600 B</text><text x="479.5" y="210" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">double-buffer storage</text><rect x="646" y="142" width="251" height="128" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="771.5" y="179" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">373,248,000 B/s</text><text x="771.5" y="210" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">one-direction active write</text><rect x="230" y="345" width="500" height="95" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="480" y="382" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">746,496,000 B/s</text><text x="480" y="413" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">read + write active-pixel aggregate</text><text x="480" y="492" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Stride padding, AXI bursts, refresh, blanking and sharing add costs: not DDR sign-off.</text></svg>
