<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="14setupbudgett 14setupbudgetd"><title id="14setupbudgett">Setup预算与捕获沿的余量</title><desc id="14setupbudgetd">单时钟理想示例从发射边沿E0到捕获沿E1有一个周期T，数据到达由clk-to-Q和最大组合延迟决定；捕获边沿减去setup和uncertainty是required。slack为required减arrival。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="39" y="44" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#203035">最大延迟检查：数据必须在捕获边沿之前到达</text>
<path d="M107 153H900" stroke="#d7e1dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M167 93V354" stroke="#7564b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-dasharray="7 6"/><path d="M794 93V354" stroke="#7564b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-dasharray="7 6"/>
<text x="167" y="83" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#7564b8">发射边沿 E0</text><text x="790" y="83" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#7564b8">捕获边沿 E1</text>
<path d="M167 168H750" stroke="#147f80" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="none" /><text x="460" y="149" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#147f80">Tclk-q + Tdata(max) = 到达时间</text>
<path d="M750 228H794" stroke="#c6674b" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="none" /><text x="747" y="254" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#c6674b">setup + uncertainty</text>
<path d="M750 310H794" stroke="#9c742c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><text x="744" y="329" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="end" fill="#9c742c">slack = required − arrival</text>
<rect x="78" y="372" width="803" height="72" rx="11" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="479" y="415" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#203035">理想示例：Slack_setup = T + skew − uncertainty − setup − Tcq,max − Dmax</text>
<text x="43" y="478" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">实际工具还考虑时钟树、相位关系、CPPR、IO/多周期/派生时钟等；不能只看这一条简化公式。</text>
</svg>
