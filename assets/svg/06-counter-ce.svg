<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="06countercet 06counterced"><title id="06countercet">同一时钟域中使用时钟使能</title><desc id="06counterced">计数器产生一个时钟周期的 tick，用它作为同步逻辑的时钟使能；避免把逻辑表达式直接变成新的不受约束的时钟。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="38" y="49" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">一个 clk，多处使用 enable，而不是再造一个局部时钟</text>
<rect x="44" y="128" width="188" height="148" rx="13" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><text x="138" y="165" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#7461ba">系统 clk</text><text x="138" y="208" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="19" fill="#203035">50 MHz</text><text x="138" y="244" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="15" fill="#53676d">同一个时钟网络</text>
<rect x="314" y="115" width="246" height="172" rx="13" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="437" y="154" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="23" fill="#147f80">计数器</text><text x="437" y="202" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">count == LIMIT-1</text><text x="437" y="247" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="700" font-size="17" fill="#147f80">tick = 1 个 clk 周期</text>
<rect x="660" y="115" width="250" height="172" rx="13" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/><text x="785" y="153" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#c86d4f">下游寄存器</text><text x="785" y="200" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">if (tick)</text><text x="785" y="244" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#203035">仍在 posedge clk 更新</text>
<path d="M232 199H313" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M560 199H659" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M137 278V348H780V289" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="490" y="377" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">紫线：共同 clk   ·   青线：tick / 时钟使能</text>
<text x="43" y="452" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">实现时需检查时钟频率、复位行为、时序约束；示意图不代表精确网表。</text>
</svg>
