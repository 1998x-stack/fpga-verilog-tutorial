<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="validready-title validready-desc"><title id="validready-title">VALID 与 READY 在同一个上升沿握手</title><desc id="validready-desc">源端在 VALID 拉高后保持数据与 VALID，直到某个上升沿 VALID 和 READY 同时为 1。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">VALID 与 READY 在同一个上升沿握手</text><text x="55" y="130" text-anchor="start" class="small">ACLK</text><text x="55" y="205" text-anchor="start" class="small">VALID</text><text x="55" y="285" text-anchor="start" class="small">READY</text><text x="55" y="370" text-anchor="start" class="small">DATA</text><path d="M150 120 H900" stroke="#aab7b5" stroke-width="2"/><path d="M150 145 V120 H210 V145 H270 V120 H330 V145 H390 V120 H450 V145 H510 V120 H570 V145 H630 V120 H690 V145 H750 V120 H810 V145 H870 V120 H900" fill="none" stroke="#20343a" stroke-width="3"/><path d="M150 220 H270 V185 H570 V220 H900" fill="none" stroke="#147f80" stroke-width="4"/><path d="M150 300 H390 V265 H630 V300 H900" fill="none" stroke="#c18a39" stroke-width="4"/><path d="M150 385 H270 V350 H570 V385 H900" fill="none" stroke="#5378a8" stroke-width="4"/><text x="420" y="340" text-anchor="middle" class="tiny">DATA = 0xA5，等待 READY</text><text x="510" y="410" text-anchor="middle" class="small">READY=1 且 VALID=1：在该沿传输</text><rect x="510" y="100" width="12" height="300" fill="#e6d7b4" opacity=".45"/><text x="516" y="90" text-anchor="middle" class="tiny">握手沿</text><text x="480" y="485" text-anchor="middle" class="small">READY 可以晚到；VALID 和 payload 在握手前不能撤回或改变。</text></svg>
