<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="09spimodest 09spimodesd"><title id="09spimodest">SPI 的四种 CPOL CPHA 时序模式</title><desc id="09spimodesd">Mode 0 至 3 分别由 CPOL 与 CPHA 组合；CPOL 决定时钟空闲电平，CPHA=0 在 leading edge 采样、CPHA=1 在 trailing edge 采样。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="43" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">CPOL 决定空闲电平 · CPHA 决定采样哪一个边沿</text>
<rect x="43" y="89" width="430" height="146" rx="10" fill="#fffdf9" stroke="#c9d8d4" stroke-width="2"/><text x="61" y="122" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">Mode 0: CPOL=0, CPHA=0</text><path d="M68 207H158V140H224V207H290V140H353V207H441" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 135V213" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M224 135V213" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M290 135V213" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M353 135V213" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="260" y="228" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#c86d4f">第一个沿采样</text><rect x="511" y="89" width="430" height="146" rx="10" fill="#fffdf9" stroke="#c9d8d4" stroke-width="2"/><text x="529" y="122" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">Mode 1: CPOL=0, CPHA=1</text><path d="M536 207H626V140H692V207H758V140H821V207H909" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M626 135V213" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M692 135V213" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M758 135V213" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M821 135V213" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="728" y="228" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#c86d4f">第二个沿采样</text><rect x="43" y="257" width="430" height="146" rx="10" fill="#fffdf9" stroke="#c9d8d4" stroke-width="2"/><text x="61" y="290" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">Mode 2: CPOL=1, CPHA=0</text><path d="M68 308H158V375H224V308H290V375H353V308H441" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M158 303V381" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M224 303V381" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M290 303V381" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M353 303V381" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="260" y="396" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#c86d4f">第一个沿采样</text><rect x="511" y="257" width="430" height="146" rx="10" fill="#fffdf9" stroke="#c9d8d4" stroke-width="2"/><text x="529" y="290" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">Mode 3: CPOL=1, CPHA=1</text><path d="M536 308H626V375H692V308H758V375H821V308H909" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M626 303V381" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M692 303V381" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M758 303V381" fill="none" stroke="#c9d8d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M821 303V381" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="728" y="396" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#c86d4f">第二个沿采样</text>
<text x="42" y="461" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">leading / trailing 指每一位周期的首沿 / 次沿；必须同时满足器件数据建立和保持时间。</text>
</svg>
