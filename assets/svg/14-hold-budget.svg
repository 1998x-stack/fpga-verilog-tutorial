<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="14holdbudgett 14holdbudgetd"><title id="14holdbudgett">Hold是最小延迟检查而非放慢时钟</title><desc id="14holdbudgetd">同一采样边沿附近，数据新值不能过早抵达捕获触发器；考虑最小clk-to-Q、最小数据延迟、hold、clock skew与uncertainty，频率降低通常不能直接修复hold。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="39" y="44" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#203035">最小延迟检查：新值不能过早覆盖本次采样</text>
<path d="M92 225H894" stroke="#d7e1dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none" /><path d="M424 91V356" stroke="#7564b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" stroke-dasharray="6 7"/>
<text x="424" y="82" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#7564b8">同一名义捕获边沿</text>
<rect x="125" y="155" width="305" height="76" rx="10" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="278" y="201" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">Tcq,min + Dmin</text>
<rect x="476" y="155" width="328" height="76" rx="10" fill="#fbeae3" stroke="#c6674b" stroke-width="2"/><text x="640" y="201" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#c6674b">skew + hold + uncertainty</text>
<path d="M430 263H476" stroke="#9c742c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none" /><text x="453" y="297" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#9c742c">Hold 余量</text>
<rect x="88" y="361" width="789" height="75" rx="11" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="479" y="402" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#203035">Slack_hold = Tcq,min + Dmin − skew − hold − uncertainty</text>
<text x="41" y="476" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">这张图是相同名义边沿、理想单周期路径示意；工具须在真实路由后检查最小延迟。</text>
</svg>
