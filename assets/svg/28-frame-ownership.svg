<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="frameownership-title frameownership-desc"><title id="frameownership-title">Double frame buffer ownership and safe swap boundary</title><desc id="frameownership-desc">A writer fills an inactive buffer while a reader displays the last complete buffer; swap only when a frame is complete and the reader reaches a safe boundary.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="43" y="48" font-size="24" font-weight="700" text-anchor="start" fill="#24373c">双缓冲不是简单的地址轮换：必须先完成写入再移交所有权</text><rect x="50" y="140" width="860" height="73" rx="9" fill="#eef4fc" stroke="#b8c7c2"/><text x="135" y="184" font-size="15" font-weight="700" text-anchor="middle" fill="#24373c">Time / phase</text><text x="318" y="184" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">Capture F0</text><text x="501" y="184" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">Display F0</text><text x="684" y="184" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">Capture F1</text><text x="867" y="184" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">Display F1</text><rect x="50" y="235" width="860" height="73" rx="9" fill="#eaf5ef" stroke="#b8c7c2"/><text x="135" y="279" font-size="15" font-weight="700" text-anchor="middle" fill="#24373c">Buffer A</text><text x="318" y="279" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">WRITE F0</text><text x="501" y="279" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">READY F0</text><text x="684" y="279" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">READ F0</text><text x="867" y="279" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">FREE</text><rect x="50" y="330" width="860" height="73" rx="9" fill="#fff3e3" stroke="#b8c7c2"/><text x="135" y="374" font-size="15" font-weight="700" text-anchor="middle" fill="#24373c">Buffer B</text><text x="318" y="374" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">FREE</text><text x="501" y="374" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">FREE</text><text x="684" y="374" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">WRITE F1</text><text x="867" y="374" font-size="14" font-weight="500" text-anchor="middle" fill="#24373c">READY F1</text><text x="480" y="465" font-size="15" font-weight="500" text-anchor="middle" fill="#52666b">示意所有权状态：真实读写阶段可重叠，不能在读者仍访问时覆写同一帧。</text><text x="480" y="493" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">一帧完成与安全切换必须来自明确握手；DDR 控制器效率另行评估。</text></svg>
