<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="11fifooccupancyt 11fifooccupancyd"><title id="11fifooccupancyt">同步 FIFO 的占用计数与读写条件</title><desc id="11fifooccupancyd">深度为四的环形存储四个槽位，读指针指最老有效元素，写指针指下一写入槽位；count=0 empty、count=4 full。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="41" y="45" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="start" fill="#203035">FIFO：数据顺序不变；指针分别沿环形地址推进</text>
<rect x="112" y="143" width="160" height="145" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="192" y="183" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203035">slot 0</text><text x="192" y="233" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#147f80">A（最老）</text><rect x="299" y="143" width="160" height="145" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="379" y="183" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203035">slot 1</text><text x="379" y="233" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#147f80">B</text><rect x="486" y="143" width="160" height="145" rx="12" fill="#fbf4dd" stroke="#9c742c" stroke-width="2"/><text x="566" y="183" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203035">slot 2</text><text x="566" y="233" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58686e">空闲</text><rect x="673" y="143" width="160" height="145" rx="12" fill="#fbf4dd" stroke="#9c742c" stroke-width="2"/><text x="753" y="183" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203035">slot 3</text><text x="753" y="233" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58686e">空闲</text>
<path d="M191 294V337 M378 294V337" stroke="#147f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none" />
<text x="191" y="367" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#147f80">rd_ptr → 0</text><text x="383" y="367" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#c6674b">wr_ptr → 2</text>
<rect x="120" y="404" width="715" height="56" rx="10" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="475" y="438" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#7564b8">count = 2；empty = (count == 0)；full = (count == DEPTH)</text>
<text x="42" y="488" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">此图表示单时钟计数型 FIFO，不代表异步双时钟 FIFO 的空满实现。</text>
</svg>
