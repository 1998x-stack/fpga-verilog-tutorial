<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="serdespath-title serdespath-desc"><title id="serdespath-title">SerDes transmit and receive path</title><desc id="serdespath-desc">Parallel words are encoded and serialized to a differential channel; the receiver equalizes, recovers clock and data, deserializes and decodes.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">SerDes：数字接口跨过一条模拟信道</text><rect x="28" y="190" width="88" height="105" rx="9" class="blue"/><text x="72" y="225" text-anchor="middle" class="l" style="font-size:14px">Parallel</text><text x="72" y="258" text-anchor="middle" class="xs">并行数据</text><rect x="130" y="190" width="88" height="105" rx="9" class="blue"/><text x="174" y="225" text-anchor="middle" class="l" style="font-size:14px">Encode</text><text x="174" y="258" text-anchor="middle" class="xs">编码 / Gearbox</text><rect x="232" y="190" width="88" height="105" rx="9" class="blue"/><text x="276" y="225" text-anchor="middle" class="l" style="font-size:14px">Serializer</text><text x="276" y="258" text-anchor="middle" class="xs">串行化</text><rect x="334" y="190" width="88" height="105" rx="9" class="orange"/><text x="378" y="225" text-anchor="middle" class="l" style="font-size:14px">TX Driver</text><text x="378" y="258" text-anchor="middle" class="xs">差分驱动</text><rect x="436" y="190" width="88" height="105" rx="9" class="orange"/><text x="480" y="225" text-anchor="middle" class="l" style="font-size:14px">Channel</text><text x="480" y="258" text-anchor="middle" class="xs">PCB / Connector</text><rect x="538" y="190" width="88" height="105" rx="9" class="green"/><text x="582" y="225" text-anchor="middle" class="l" style="font-size:14px">RX EQ</text><text x="582" y="258" text-anchor="middle" class="xs">CTLE / DFE</text><rect x="640" y="190" width="88" height="105" rx="9" class="green"/><text x="684" y="225" text-anchor="middle" class="l" style="font-size:14px">CDR</text><text x="684" y="258" text-anchor="middle" class="xs">时钟恢复</text><rect x="742" y="190" width="88" height="105" rx="9" class="green"/><text x="786" y="225" text-anchor="middle" class="l" style="font-size:14px">Deserializer</text><text x="786" y="258" text-anchor="middle" class="xs">并行化</text><rect x="844" y="190" width="88" height="105" rx="9" class="purple"/><text x="888" y="225" text-anchor="middle" class="l" style="font-size:14px">Decode</text><text x="888" y="258" text-anchor="middle" class="xs">解码</text><path d="M116 242 H130" class="line"/><path d="M218 242 H232" class="line"/><path d="M320 242 H334" class="line"/><path d="M422 242 H436" class="line"/><path d="M524 242 H538" class="line"/><path d="M626 242 H640" class="line"/><path d="M728 242 H742" class="line"/><path d="M830 242 H844" class="line"/><path d="M440 330 H540" stroke="#c18a39" stroke-width="3"/><text x="490" y="355" text-anchor="middle" class="s">差分 P/N · 阻抗控制 · 插损 / 反射</text><text x="480" y="420" text-anchor="middle" class="s">PLL 生成 TX bit clock；RX CDR 从接收波形恢复采样相位。两者不是普通 fabric clock。</text><text x="480" y="465" text-anchor="middle" class="s">编码、协议、均衡 preset 和 lane bonding 由具体 PHY / IP / 标准共同决定。</text></svg>
