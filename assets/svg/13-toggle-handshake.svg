<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="13togglehandshaket 13togglehandshaked"><title id="13togglehandshaket">请求应答 toggle 跨时钟域事件握手</title><desc id="13togglehandshaked">源域翻转 req_toggle，目的域经过两级同步后比较旧值产生单周期 pulse，目的域把 seen_toggle 作为 ack 返回，源域两级同步 ack 后重新 ready。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="38" y="44" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#203035">toggle 握手：一次事件被目的域确认，才允许下一次</text>
<rect x="39" y="92" width="405" height="321" rx="12" fill="#fbf4dd" stroke="#9c742c" stroke-width="2"/><rect x="518" y="92" width="401" height="321" rx="12" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/>
<text x="241" y="137" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#9c742c">源域 src_clk</text><text x="719" y="137" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#147f80">目的域 dst_clk</text>
<rect x="87" y="175" width="297" height="82" rx="12" fill="#fffdf9" stroke="#9c742c" stroke-width="2"/><text x="235" y="207" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203035">req_toggle 翻转</text><text x="235" y="235" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">仅 src_ready 时接受</text>
<rect x="561" y="175" width="317" height="82" rx="12" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="718" y="208" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#203035">2FF → 边沿检测</text><text x="718" y="235" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">dst_pulse=1 (单周期)</text>
<path d="M384 218H560" stroke="#c6674b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><text x="473" y="197" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#c6674b">req</text>
<path d="M560 333H384" stroke="#7564b8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="none" /><text x="472" y="317" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#7564b8">ack</text>
<text x="235" y="371" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#9c742c">2FF 接收 ack；ready 恢复</text>
<text x="719" y="371" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#147f80">seen_toggle 回传</text>
<text x="40" y="467" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">事件过密时应由源端等待 ready / 缓存事件；此握手不传输宽数据总线。</text>
</svg>
