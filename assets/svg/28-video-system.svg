<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="videosys-title videosys-desc"><title id="videosys-title">Camera to display FPGA system with clock domains</title><desc id="videosys-desc">A complete system includes camera or physical receiver, pixel domain buffer, video processing, AXI frame writer, DDR, AXI frame reader and display timing, with CDC and frame ownership control.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="43" y="47" font-size="24" font-weight="700" text-anchor="start" fill="#24373c">从 Camera 到 Display：至少三类不同的时钟/接口边界</text><rect x="26" y="172" width="137" height="102" rx="13" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="94.5" y="209" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Camera RX</text><text x="94.5" y="240" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">DVP / MIPI PHY</text><rect x="183" y="172" width="137" height="102" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="251.5" y="209" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Pixel stream</text><text x="251.5" y="240" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Demosaic / gray</text><rect x="340" y="172" width="137" height="102" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="408.5" y="209" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">AXI-MM writer</text><text x="408.5" y="240" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Burst DMA + CDC</text><rect x="497" y="172" width="137" height="102" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="565.5" y="209" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">DDR buffers</text><text x="565.5" y="240" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">A / B ownership</text><rect x="654" y="172" width="137" height="102" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="722.5" y="209" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">AXI-MM reader</text><text x="722.5" y="240" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Burst DMA + CDC</text><rect x="811" y="172" width="137" height="102" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="879.5" y="209" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Display</text><text x="879.5" y="240" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Timing + PHY</text><path d="M163 220 L183 220" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M320 220 L340 220" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M477 220 L497 220" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M634 220 L654 220" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M791 220 L811 220" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="175" y="345" width="625" height="83" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="487.5" y="382" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Frame controller</text><text x="487.5" y="413" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Swap only after complete write and safe read boundary</text><path d="M490 345 V295" stroke="#7c67b5" stroke-width="3" stroke-dasharray="7 6"/><text x="480" y="483" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">本文的可运行 RTL 只覆盖 Pixel stream 中的 RGB 阈值处理，不包含 PHY、DDR 或显示输出。</text></svg>
