<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ossroles-title ossroles-desc"><title id="ossroles-title">Open-source FPGA tool roles</title><desc id="ossroles-desc">Yosys and nextpnr are not a monolithic compiler. Verilator simulates compiled models, while family-specific packers and programmers are separate tools.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">工具边界：不要把 Verilator、Yosys 和 nextpnr 当成同一种工具</text><rect x="65" y="120" width="390" height="140" rx="14" class="blue"/><text x="260" y="160" text-anchor="middle" class="l">Verification lane</text><text x="260" y="200" text-anchor="middle" class="s">Icarus：event-driven RTL simulation</text><text x="260" y="230" text-anchor="middle" class="s">Verilator：lint + compiled simulation</text><rect x="505" y="120" width="390" height="140" rx="14" class="green"/><text x="700" y="160" text-anchor="middle" class="l">Implementation lane</text><text x="700" y="200" text-anchor="middle" class="s">Yosys：elaboration / synthesis / mapping</text><text x="700" y="230" text-anchor="middle" class="s">nextpnr：placement / routing / timing-driven P&amp;R</text><path d="M455 190 H505" class="line"/><rect x="160" y="330" width="640" height="95" rx="14" class="purple"/><text x="480" y="370" text-anchor="middle" class="l">Family-specific packer and programmer</text><text x="480" y="400" text-anchor="middle" class="s">icepack / ecppack / openFPGALoader / board-specific cable</text><path d="M700 260 V295 H480 V330" class="line"/><text x="480" y="490" text-anchor="middle" class="s">开源工具的可用性取决于器件数据库、专用原语、时钟资源和板级约束。</text></svg>
