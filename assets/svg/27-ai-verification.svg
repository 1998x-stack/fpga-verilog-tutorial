<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="aiverify-title aiverify-desc"><title id="aiverify-title">AI-assisted RTL verification pipeline</title><desc id="aiverify-desc">An LLM may propose an RTL candidate, but specification, independent scoreboard, protocol assertions, synthesis and code review define acceptance.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="45" y="49" font-size="26" font-weight="700" text-anchor="start" fill="#24373c">AI 生成的是候选实现，不是已经验证的电路</text><rect x="37" y="152" width="161" height="118" rx="13" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="117.5" y="189" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Contract</text><text x="117.5" y="220" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Cycles · reset · widths</text><rect x="225" y="152" width="161" height="118" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="305.5" y="189" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Candidate RTL</text><text x="305.5" y="220" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">LLM or human draft</text><rect x="413" y="152" width="161" height="118" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="493.5" y="189" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Independent TB</text><text x="493.5" y="220" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Scoreboard / stalls</text><rect x="601" y="152" width="161" height="118" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="681.5" y="189" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Lint / CDC / STA</text><text x="681.5" y="220" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Synthesis / constraints</text><rect x="789" y="152" width="161" height="118" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="869.5" y="189" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Review &amp; merge</text><text x="869.5" y="220" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Evidence and ownership</text><path d="M198 209 L223 209" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M386 209 L411 209" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M574 209 L599 209" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M762 209 L787 209" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="180" y="350" width="585" height="90" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="472.5" y="387" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Counterexamples route back to the written contract</text><text x="472.5" y="418" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">No automatic acceptance from a successful compile</text><path d="M475 350 V305 H118 V270" fill="none" stroke="#c28a3b" stroke-width="3" stroke-dasharray="7 6"/><text x="480" y="485" font-size="15" font-weight="500" text-anchor="middle" fill="#52666b">Unit tests establish behavior for sampled cases; they are not a complete proof.</text></svg>
