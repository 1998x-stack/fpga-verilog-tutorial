<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="releasegates-title releasegates-desc"><title id="releasegates-title">从开发分支到硬件交付的证据门禁</title><desc id="releasegates-desc">合并请求通过静态检查、仿真和工具构建后，再发布带有器件与工具信息的版本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">从开发分支到硬件交付的证据门禁</text><rect x="35" y="180" width="160" height="100" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="115" y="210" text-anchor="middle" class="label">Feature branch</text><text x="115" y="236" text-anchor="middle" class="small">小步提交</text><rect x="240" y="180" width="160" height="100" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="320" y="210" text-anchor="middle" class="label">Pull request</text><text x="320" y="236" text-anchor="middle" class="small">代码审查</text><rect x="445" y="180" width="160" height="100" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="525" y="210" text-anchor="middle" class="label">CI</text><text x="525" y="236" text-anchor="middle" class="small">仿真 / lint / docs</text><rect x="650" y="180" width="125" height="100" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="712.5" y="210" text-anchor="middle" class="label">Review</text><text x="712.5" y="236" text-anchor="middle" class="small">STA / DRC</text><rect x="820" y="180" width="110" height="100" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="875" y="210" text-anchor="middle" class="label">Release</text><text x="875" y="236" text-anchor="middle" class="small">tag / files</text><path d="M195 230 L240 230" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M400 230 L445 230" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 230 L650 230" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 230 L820 230" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="350" text-anchor="middle" class="label">CI 绿灯 ≠ FPGA 已上板；板级验收需要单独的测试记录。</text><text x="480" y="415" text-anchor="middle" class="small">release manifest 绑定 commit、器件、工具版本、约束和报告。</text></svg>
