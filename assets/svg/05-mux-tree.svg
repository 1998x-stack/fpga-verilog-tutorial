<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="e01t e01d"><title id="e01t">4 比 1 多路选择器的逻辑树与真值对应</title><desc id="e01d">两个第一级 2:1 MUX 由 s0 控制，第二级由 s1 决定输出。输入 d0-d3；sel=00 输出 d0，01 输出 d1，10 输出 d2，11 输出 d3。</desc><defs><marker id="e01arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="39" y="43" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="start" font-weight="750">4:1 MUX = 两层 2:1 选择</text>
<rect x="47" y="96" width="114" height="36" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="104" y="120" font-family="system-ui,sans-serif" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">d0</text><path d="M161 114H273V152H332" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="180" width="114" height="36" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="104" y="204" font-family="system-ui,sans-serif" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">d1</text><path d="M161 198H332" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="264" width="114" height="36" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="104" y="288" font-family="system-ui,sans-serif" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">d2</text><path d="M161 282H273V312H332" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="47" y="348" width="114" height="36" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="104" y="372" font-family="system-ui,sans-serif" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">d3</text><path d="M161 366H280V353H332" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<rect x="334" y="132" width="155" height="83" rx="15" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="411" y="164" font-family="system-ui,sans-serif" font-size="21" fill="#147f80" text-anchor="middle" font-weight="750">MUX 2:1</text><text x="411" y="191" font-family="system-ui,sans-serif" font-size="16" fill="#203035" text-anchor="middle" font-weight="500">sel = s0</text>
