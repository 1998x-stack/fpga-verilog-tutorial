<text x="580" y="425" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="700">00 → d0    01 → d1    10 → d2    11 → d3</text>
<text x="470" y="467" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">这些只是等价布尔结构；实际 LUT / MUXF7 映射需要看器件与综合报告。</text>
