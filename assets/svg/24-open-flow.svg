<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="of24 of24d">
  <title id="of24">开源 FPGA 工具链的分工</title>
  <desc id="of24d">源文件先经 Yosys 综合成门级网表（JSON），再由 nextpnr 针对具体器件做布局布线得到 .asc，icepack 打包为比特流并用 openFPGALoader 烧录；同一条源文件还可以交给 Verilator 做高速仿真、用 GTKWave 看波形。综合与布局布线依赖对应器件的开源器件数据库。</desc>
  <rect width="960" height="500" fill="#fffdf9"/>
  <text x="40" y="42" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" fill="#203035">一条不依赖商业许可证的构建链</text>
  <g font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" text-anchor="middle">
    <rect x="24" y="86" width="150" height="140" rx="13" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/>
    <text x="99" y="122" font-size="18" font-weight="750" fill="#203035">源文件</text>
    <text x="99" y="156" font-size="14" font-weight="500" fill="#203035">top.v 等</text>
    <text x="99" y="180" font-size="14" font-weight="500" fill="#203035">可综合 RTL</text>

    <rect x="196" y="86" width="150" height="140" rx="13" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/>
    <text x="271" y="122" font-size="18" font-weight="750" fill="#203035">Yosys</text>
    <text x="271" y="156" font-size="14" font-weight="500" fill="#203035">综合</text>
    <text x="271" y="180" font-size="14" font-weight="700" fill="#7564b8">→ netlist.json</text>

    <rect x="368" y="86" width="150" height="140" rx="13" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/>
    <text x="443" y="122" font-size="18" font-weight="750" fill="#203035">nextpnr</text>
    <text x="443" y="156" font-size="14" font-weight="500" fill="#203035">布局 + 布线</text>
    <text x="443" y="180" font-size="14" font-weight="700" fill="#147f80">→ .asc</text>

    <rect x="540" y="86" width="150" height="140" rx="13" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/>
    <text x="615" y="122" font-size="18" font-weight="750" fill="#203035">icepack 等</text>
    <text x="615" y="156" font-size="14" font-weight="500" fill="#203035">位流打包</text>
    <text x="615" y="180" font-size="14" font-weight="700" fill="#7564b8">→ .bin/.bit</text>

    <rect x="712" y="86" width="224" height="140" rx="13" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/>
    <text x="824" y="122" font-size="18" font-weight="750" fill="#203035">openFPGALoader</text>
    <text x="824" y="156" font-size="14" font-weight="500" fill="#203035">经下载器写入</text>
    <text x="824" y="180" font-size="14" font-weight="500" fill="#203035">iCE40 / ECP5 等</text>

    <rect x="196" y="272" width="322" height="118" rx="13" fill="#eef4fb" stroke="#2f5d8a" stroke-width="2"/>
    <text x="357" y="306" font-size="17" font-weight="750" fill="#203035">Verilator / iverilog 仿真</text>
    <text x="357" y="336" font-size="14" font-weight="500" fill="#203035">编译为 C++ 模型或事件驱动仿真</text>
    <text x="357" y="362" font-size="14" font-weight="700" fill="#2f5d8a">→ VCD 波形 → GTKWave</text>

    <rect x="540" y="272" width="396" height="118" rx="13" fill="#fbf4dd" stroke="#9c742c" stroke-width="2"/>
    <text x="738" y="306" font-size="16" font-weight="750" fill="#9c742c">器件数据库：icestorm / prjtrellis / apicula …</text>
    <text x="738" y="336" font-size="14" font-weight="500" fill="#203035">综合与布局布线能否成立，取决于目标器件是否被支持</text>
  </g>
  <g stroke="#c6674b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M174 156H192"/><path d="M346 156H364"/><path d="M518 156H536"/><path d="M690 156H708"/>
  </g>
</svg>
