<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="linkbudget-title linkbudget-desc"><title id="linkbudget-title">Serial link throughput budget</title><desc id="linkbudget-desc">Raw lane rate is multiplied by lane count and line-code efficiency, then reduced by protocol overhead; result is per direction.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">先算编码效率，再谈有效吞吐</text><rect x="45" y="145" width="190" height="120" rx="14" class="blue"/><text x="140" y="190" text-anchor="middle" class="l">Line rate</text><text x="140" y="225" text-anchor="middle" class="s">Gb/s per lane</text><text x="255" y="215" class="h">×</text><rect x="295" y="145" width="155" height="120" rx="14" class="blue"/><text x="372" y="190" text-anchor="middle" class="l">Lane count</text><text x="372" y="225" text-anchor="middle" class="s">x1 / x4 / x16</text><text x="465" y="215" class="h">×</text><rect x="505" y="145" width="190" height="120" rx="14" class="orange"/><text x="600" y="190" text-anchor="middle" class="l">Coding ratio</text><text x="600" y="225" text-anchor="middle" class="s">8/10 or 128/130</text><text x="710" y="215" class="h">×</text><rect x="755" y="145" width="165" height="120" rx="14" class="purple"/><text x="837" y="190" text-anchor="middle" class="l">Protocol</text><text x="837" y="225" text-anchor="middle" class="s">efficiency ≤ 1</text><path d="M480 285 V365" class="line"/><rect x="225" y="365" width="510" height="90" rx="14" class="green"/><text x="480" y="405" text-anchor="middle" class="l">Useful payload upper bound</text><text x="480" y="435" text-anchor="middle" class="s">Gb/s per direction ÷ 8 = GB/s per direction</text><text x="480" y="500" text-anchor="middle" class="xs">不含 FEC / TLP / DLLP / idle / flow-control 等额外开销时，只是理论上界。</text></svg>
