<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="06debouncet 06debounced"><title id="06debouncet">按钮采样与稳定计数式消抖</title><desc id="06debounced">异步按钮先由两级同步器进入内部时钟域，再要求相同采样值连续保持固定个数时钟周期后更改 debounced 输出。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="39" y="47" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">一个毛刺不能改变稳定后的状态</text>
<rect x="34" y="122" width="167" height="194" rx="13" fill="#fcf3dc" stroke="#956d25" stroke-width="2"/><text x="118" y="174" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="20" fill="#956d25">按钮输入</text><text x="118" y="223" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">异步 / 抖动</text>
<rect x="240" y="122" width="175" height="194" rx="13" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><text x="327" y="173" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="21" fill="#7461ba">两级 FF</text><text x="327" y="219" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">同步采样</text>
<rect x="452" y="122" width="230" height="194" rx="13" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="566" y="168" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="20" fill="#147f80">稳定窗口计数</text><text x="566" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#203035">样本不同 → 归零</text><text x="566" y="244" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">连续相同 N 次</text>
<rect x="717" y="122" width="209" height="194" rx="13" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/><text x="821" y="168" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="21" fill="#c86d4f">debounced</text><text x="821" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">仅在满足条件时</text><text x="821" y="252" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">更新状态</text>
<path d="M201 220H239" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M415 220H451" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M682 220H716" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="478" y="394" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">可进一步比较当前值与上一拍 debounced，以生成单周期的 press_pulse。</text>
<text x="42" y="451" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">注意：2FF 同步器降低亚稳态传播概率，但不保证任意情况下都不会亚稳态。</text>
</svg>
