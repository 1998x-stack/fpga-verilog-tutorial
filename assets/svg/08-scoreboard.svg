<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="08scoreboardt 08scoreboardd"><title id="08scoreboardt">仿真验证：DUT 与参考模型独立比较</title><desc id="08scoreboardd">测试台生成输入激励，独立 reference model 计算期望，监视器按约定边沿采样 DUT 输出，scoreboard 对照并在不一致时失败。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="36" y="46" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">自动检查比肉眼“波形看着对”更可靠</text>
<rect x="39" y="125" width="190" height="215" rx="13" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><text x="134" y="168" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="21" fill="#7461ba">Stimulus</text><text x="134" y="213" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">输入序列</text><text x="134" y="258" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">reset / clock</text>
<rect x="318" y="103" width="262" height="104" rx="13" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="449" y="152" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="20" fill="#147f80">DUT（被测 RTL）</text>
<rect x="318" y="266" width="262" height="104" rx="13" fill="#fcf3dc" stroke="#956d25" stroke-width="2"/><text x="449" y="313" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="19" fill="#956d25">Reference Model</text>
<rect x="666" y="170" width="259" height="162" rx="13" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/><text x="795" y="215" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="22" fill="#c86d4f">Scoreboard</text><text x="795" y="255" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">actual === expected</text><text x="795" y="291" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#c86d4f">不符：$fatal</text>
<path d="M229 209H274V155H316" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M229 252H274V318H316" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M580 155H620V218H665" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M580 318H620V269H665" fill="none" stroke="#956d25" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<text x="472" y="432" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">同步检查的“观察点”要明确：不要在 NBA 提交前读寄存器的新值。</text>
</svg>
