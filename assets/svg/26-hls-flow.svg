<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hlsflow-title hlsflow-desc"><title id="hlsflow-title">HLS verification and implementation path</title><desc id="hlsflow-desc">C/C++ source is tested by C simulation, scheduled and synthesized to RTL, verified by co-simulation, then implemented and checked against device timing, not automatically translated into correct hardware.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="45" y="50" font-size="26" font-weight="700" text-anchor="start" fill="#24373c">HLS：从程序语义走向可约束的硬件实现</text><rect x="33" y="170" width="164" height="116" rx="13" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="115" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">1 · Algorithm</text><text x="115" y="238" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">C / C++ + fixed widths</text><rect x="222" y="170" width="164" height="116" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="304" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">2 · C simulation</text><text x="304" y="238" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Reference &amp; edge cases</text><rect x="411" y="170" width="164" height="116" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="493" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">3 · C synthesis</text><text x="493" y="238" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Schedule · bind · map</text><rect x="600" y="170" width="164" height="116" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="682" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">4 · RTL co-sim</text><text x="682" y="238" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Transaction comparison</text><rect x="789" y="170" width="164" height="116" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="871" y="207" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">5 · Implement</text><text x="871" y="238" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">STA · resources · power</text><path d="M197 226 L219 226" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M386 226 L408 226" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M575 226 L597 226" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M764 226 L786 226" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="220" y="365" width="525" height="75" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="482.5" y="402" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Design report: achieved II · latency · DSP · BRAM · LUT</text><text x="482.5" y="433" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Do not treat a pragma as measured timing</text><text x="480" y="485" font-size="15" font-weight="500" text-anchor="middle" fill="#52666b">C simulation covers values; synthesis and place-and-route establish hardware costs.</text></svg>
