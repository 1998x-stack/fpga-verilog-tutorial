<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="15debugclosuret 15debugclosured"><title id="15debugclosuret">综合、STA和ILA各自证明什么</title><desc id="15debugclosured">仿真检查功能，STA约束物理路径，ILA观察运行时数字信号；三者覆盖不同层次，任何一项单独通过不能证明全部硬件正确。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="40" y="44" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="start" fill="#203035">三种证据互补：Functional / Timing / Board</text>
<rect x="30" y="106" width="281" height="290" rx="16" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="171" y="147" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#147f80">仿真 / Testbench</text><text x="171" y="206" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">逻辑与协议功能</text><text x="171" y="266" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">可检查输入输出断言</text><text x="171" y="340" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f80">不模型化模拟亚稳态</text><rect x="340" y="106" width="281" height="290" rx="16" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="481" y="147" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#7564b8">STA / DRC</text><text x="481" y="206" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">物理实现与约束</text><text x="481" y="266" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">检查最大/最小路径</text><text x="481" y="340" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#7564b8">不证明软件协议完整</text><rect x="650" y="106" width="281" height="290" rx="16" fill="#fbeae3" stroke="#c6674b" stroke-width="2"/><text x="791" y="147" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#c6674b">ILA / 板级</text><text x="791" y="206" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">现场数字信号</text><text x="791" y="266" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#58686e">捕获具体触发窗口</text><text x="791" y="340" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#c6674b">不能替代全部测试覆盖</text>
<text x="39" y="464" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#58686e">ILA 插入探针会改变资源/时序；调试构建本身也必须重新完成时序验证。</text>
</svg>
