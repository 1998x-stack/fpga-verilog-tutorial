<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="10i2cnineclockst 10i2cnineclocksd"><title id="10i2cnineclockst">I2C 7 位地址与第九 ACK 时钟</title><desc id="10i2cnineclocksd">7 个地址位、1 个方向位、1 个 ACK/NACK 位；ACK=0 是目标设备拉低 SDA，NACK=1 表示没有设备拉低。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="43" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#203035">一个地址字节 = 7 位地址 + R/W + 第 9 个 ACK</text>
<rect x="53" y="118" width="87" height="143" rx="6" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="96" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">A6</text><text x="96" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 1</text><rect x="149" y="118" width="87" height="143" rx="6" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="192" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">A5</text><text x="192" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 2</text><rect x="245" y="118" width="87" height="143" rx="6" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="288" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">A4</text><text x="288" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 3</text><rect x="341" y="118" width="87" height="143" rx="6" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="384" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">A3</text><text x="384" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 4</text><rect x="437" y="118" width="87" height="143" rx="6" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="480" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">A2</text><text x="480" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 5</text><rect x="533" y="118" width="87" height="143" rx="6" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="576" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">A1</text><text x="576" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 6</text><rect x="629" y="118" width="87" height="143" rx="6" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="672" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">A0</text><text x="672" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 7</text><rect x="725" y="118" width="87" height="143" rx="6" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><text x="768" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">R/W</text><text x="768" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 8</text><rect x="821" y="118" width="87" height="143" rx="6" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/><text x="864" y="170" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#203035">ACK</text><text x="864" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="14" fill="#53676d">CLK 9</text>
<rect x="58" y="302" width="410" height="82" rx="10" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="263" y="332" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#147f80">前 8 位：控制器驱动 SDA</text><text x="263" y="360" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="15" fill="#53676d">按 MSB first 逐位发送</text>
<rect x="502" y="302" width="403" height="82" rx="10" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/><text x="703" y="332" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#c86d4f">第 9 位：控制器释放 SDA</text><text x="703" y="360" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="15" fill="#53676d">目标设备拉低表示 ACK</text>
<text x="43" y="452" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">NACK 可以表示地址未匹配、设备忙等；不能把所有 NACK 都当成 SCL stretching。</text>
</svg>
