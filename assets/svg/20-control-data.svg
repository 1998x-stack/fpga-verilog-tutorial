<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="controldata-title controldata-desc"><title id="controldata-title">控制平面与数据平面采用不同的传输方式</title><desc id="controldata-desc">AXI4-Lite 适合低速配置与状态访问；AXI4-Stream 适合连续样本、数据包或图像流。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">控制平面与数据平面采用不同的传输方式</text><rect x="45" y="130" width="200" height="105" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="145" y="160" text-anchor="middle" class="label">CPU firmware</text><text x="145" y="186" text-anchor="middle" class="small">配置参数 / 处理中断</text><rect x="365" y="130" width="220" height="105" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="475" y="160" text-anchor="middle" class="label">AXI4-Lite</text><text x="475" y="186" text-anchor="middle" class="small">Control / Status registers</text><rect x="700" y="130" width="210" height="105" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="805" y="160" text-anchor="middle" class="label">RTL accelerator</text><text x="805" y="186" text-anchor="middle" class="small">控制寄存器 / 状态</text><path d="M245 180 L365 180" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="305" y="171" text-anchor="middle" class="tiny">少量寄存器访问</text><path d="M585 180 L700 180" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="325" width="200" height="105" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="145" y="355" text-anchor="middle" class="label">DMA / source</text><text x="145" y="381" text-anchor="middle" class="small">buffer / descriptor</text><rect x="365" y="325" width="220" height="105" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="475" y="355" text-anchor="middle" class="label">AXI4-Stream</text><text x="475" y="381" text-anchor="middle" class="small">TVALID / TREADY / TDATA</text><rect x="700" y="325" width="210" height="105" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="805" y="355" text-anchor="middle" class="label">DSP pipeline</text><text x="805" y="381" text-anchor="middle" class="small">持续吞吐数据</text><path d="M245 375 L365 375" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="305" y="366" text-anchor="middle" class="tiny">数据搬运</text><path d="M585 375 L700 375" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="485" text-anchor="middle" class="small">不要用 CPU 逐字读写代替适合 DMA/Stream 的大块数据传输。</text></svg>
