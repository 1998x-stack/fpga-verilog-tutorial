<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="a02t a02d"><title id="a02t">从可综合 RTL 到 FPGA 配置文件的工程流程</title><desc id="a02d">描述 RTL 后建立仿真测试，经过综合、布局布线与时序报告分析，最后下载比特流配置 FPGA。各阶段通过反馈箭头修正前一阶段。</desc><defs><marker id="a02arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="38" y="45" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="start" font-weight="750">电路设计的五个判断点</text>
<rect x="24" y="120" width="173" height="217" rx="13" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="110" y="163" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="middle" font-weight="750">RTL</text><text x="110" y="220" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">描述行为与结构</text><text x="110" y="254" font-family="system-ui,sans-serif" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500">不是按行执行的程序</text><path d="M198 224H214" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a02arrow)"/><rect x="214" y="120" width="173" height="217" rx="13" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="300" y="163" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="middle" font-weight="750">仿真</text><text x="300" y="220" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">检查功能与协议</text><text x="300" y="254" font-family="system-ui,sans-serif" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500">看波形和自检结果</text><path d="M388 224H404" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a02arrow)"/><rect x="404" y="120" width="173" height="217" rx="13" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="490" y="163" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="middle" font-weight="750">综合</text><text x="490" y="220" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">将 HDL 映射为逻辑</text><text x="490" y="254" font-family="system-ui,sans-serif" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500">看锁存器/资源警告</text><path d="M578 224H594" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a02arrow)"/><rect x="594" y="120" width="173" height="217" rx="13" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="680" y="163" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="middle" font-weight="750">布局布线</text><text x="680" y="220" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">决定位置与连线</text><text x="680" y="254" font-family="system-ui,sans-serif" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500">查看路径与延迟</text><path d="M768 224H784" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a02arrow)"/><rect x="784" y="120" width="173" height="217" rx="13" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="870" y="163" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="middle" font-weight="750">配置</text><text x="870" y="220" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">生成并下载 bitstream</text><text x="870" y="254" font-family="system-ui,sans-serif" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500">硬件观测和对照</text>
<path d="M890 356V403H130V355" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="490" y="440" font-family="system-ui,sans-serif" font-size="18" fill="#7461ba" text-anchor="middle" font-weight="700">反复迭代：功能正确 ≠ 已通过时序、资源或板级验证</text>
</svg>
