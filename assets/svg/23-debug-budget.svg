<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="debugbudget-title debugbudget-desc"><title id="debugbudget-title">Debug instrumentation cost and release comparison</title><desc id="debugbudget-desc">Debug probes consume storage and logic and can perturb placement and timing. Compare debug and production builds using the same constraints.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">调试逻辑本身也会改变被测设计</text><rect x="65" y="120" width="360" height="255" rx="15" class="blue"/><text x="245" y="160" text-anchor="middle" class="l">Debug build</text><rect x="110" y="195" width="270" height="55" rx="8" class="green"/><text x="245" y="230" text-anchor="middle" class="s">Functional RTL</text><rect x="110" y="275" width="270" height="55" rx="8" class="orange"/><text x="245" y="310" text-anchor="middle" class="s">ILA / probes / triggers</text><rect x="535" y="120" width="360" height="255" rx="15" class="purple"/><text x="715" y="160" text-anchor="middle" class="l">Production build</text><rect x="580" y="195" width="270" height="55" rx="8" class="green"/><text x="715" y="230" text-anchor="middle" class="s">Functional RTL</text><rect x="580" y="275" width="270" height="55" rx="8" fill="#fff" stroke="#9aaca5" stroke-dasharray="6 4"/><text x="715" y="310" text-anchor="middle" class="s">Debug cores removed</text><path d="M425 245 H535" class="line"/><text x="480" y="430" text-anchor="middle" class="s">分别检查 utilization、critical path、clock routing 与 debug timing；不能把 debug build 的时序当成 production sign-off。</text></svg>
