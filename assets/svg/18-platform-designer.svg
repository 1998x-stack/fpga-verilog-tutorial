<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="pd-title pd-desc"><title id="pd-title">Platform Designer interface integration</title><desc id="pd-desc">A processor memory-mapped host connects through interconnect and protocol adapters to memory and peripherals, while clock and reset domains are connected explicitly.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#467e7e"/></marker></defs><style>.h{font:700 24px Inter,'Noto Sans SC',sans-serif;fill:#20343a}.l{font:700 18px Inter,'Noto Sans SC',sans-serif;fill:#20343a}.s{font:500 15px Inter,'Noto Sans SC',sans-serif;fill:#52656b}.t{font:600 14px Inter,'Noto Sans SC',sans-serif;fill:#8b5e22}</style><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">Platform Designer builds a system from interface contracts</text><rect x="40" y="165" width="180" height="105" rx="14" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="130" y="205" text-anchor="middle" class="l">Processor</text><text x="130" y="237" text-anchor="middle" class="s">Avalon host / AXI master</text><rect x="330" y="145" width="270" height="145" rx="14" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="465" y="190" text-anchor="middle" class="l">Interconnect</text><text x="465" y="225" text-anchor="middle" class="s">Decode · arbitrate · route</text><text x="465" y="255" text-anchor="middle" class="s">Protocol adapter / bridge</text><rect x="710" y="90" width="205" height="95" rx="14" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="812" y="130" text-anchor="middle" class="l">Memory</text><text x="812" y="160" text-anchor="middle" class="s">BRAM controller</text><rect x="710" y="220" width="205" height="95" rx="14" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="812" y="260" text-anchor="middle" class="l">Custom IP</text><text x="812" y="290" text-anchor="middle" class="s">AXI4-Lite / Avalon-MM</text><path d="M220 215 H330 M600 190 L710 138 M600 245 L710 267" stroke="#467e7e" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="275" y="195" text-anchor="middle" class="t">host</text><text x="650" y="120" text-anchor="middle" class="t">memory mapped</text><text x="650" y="250" text-anchor="middle" class="t">memory mapped</text><rect x="100" y="365" width="330" height="75" rx="12" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="265" y="395" text-anchor="middle" class="l">Clock domains</text><text x="265" y="423" text-anchor="middle" class="s">Frequency / phase / crossing</text><rect x="530" y="365" width="330" height="75" rx="12" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="695" y="395" text-anchor="middle" class="l">Reset domains</text><text x="695" y="423" text-anchor="middle" class="s">Polarity / sync release / sequencing</text><text x="480" y="490" text-anchor="middle" class="s">自动连接只帮助布线；协议、时钟、复位和地址仍须逐项验证。</text></svg>
