<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="rvfmt-title rvfmt-desc"><title id="rvfmt-title">RV32I base instruction formats</title><desc id="rvfmt-desc">Six instruction formats R, I, S, B, U and J. Register fields remain in fixed positions while B and J immediate bits are rearranged.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">RV32I：寄存器字段固定，立即数按格式重组</text><text x="50" y="93" class="s">bit 31</text><text x="878" y="93" class="s">bit 0</text><text x="65" y="141" class="l">R</text><rect x="130" y="112" width="166" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="195" y="130" text-anchor="middle" class="s">funct7</text><text x="195" y="146" text-anchor="middle" class="xs">31:25</text><rect x="260" y="112" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="300" y="130" text-anchor="middle" class="s">rs2</text><text x="300" y="146" text-anchor="middle" class="xs">24:20</text><rect x="340" y="112" width="119" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="380" y="130" text-anchor="middle" class="s">rs1</text><text x="380" y="146" text-anchor="middle" class="xs">19:15</text><rect x="420" y="112" width="71" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="449" y="130" text-anchor="middle" class="s">funct3</text><text x="449" y="146" text-anchor="middle" class="xs">14:12</text><rect x="478" y="112" width="119" hei