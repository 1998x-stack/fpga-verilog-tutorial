<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="f21t f21d">
  <title id="f21t">RV32I 六种指令格式的位域分布</title>
  <desc id="f21d">六行分别代表 R、I、S、B、U、J 型指令的 32 位编码。所有格式的 opcode[6:0] 固定在最右七位；rd、rs1、rs2 位置固定；立即数在 I 型占 [31:20]，在 S/B 型拆成两段，在 U 型占 [31:12]，在 J 型按散列排布。定长与固定字段使译码只需固定切位。</desc>
  <rect width="980" height="520" fill="#fffdf9"/>
  <text x="40" y="40" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">定长 32 位，字段位置固定</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" text-anchor="middle">
    <!-- row template: y label then boxes -->
    <!-- R -->
    <text x="40" y="104" font-family="system-ui,sans-serif" font-size="13" font-weight="750" fill="#203035">R</text>
    <g stroke="#147f80" stroke-width="1.5" fill="#e8f4ef">
      <rect x="70" y="88" width="183.75" height="24"/><rect x="253.75" y="88" width="131.25" height="24"/><rect x="385" y="88" width="131.25" height="24"/><rect x="516.25" y="88" width="78.75" height="24"/><rect x="595" y="88" width="131.25" height="24"/><rect x="726.25" y="88" width="183.75" height="24"/>
    </g>
    <text x="161" y="105" fill="#203035">funct7</text><text x="319" y="105" fill="#203035">rs2</text><text x="450" y="105" fill="#203035">rs1</text><text x="555" y="105" fill="#203035">f3</text><text x="660" y="105" fill="#203035">rd</text><text x="818" y="105" fill="#203035">opcode</text>
    <!-- I -->
    <text x="40" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="750" fill="#203035">I</text>
    <g stroke="#7564b8" stroke-width="1.5" fill="#f1edfa">
      <rect x="70" y="140" width="315" height="24"/><rect x="385" y="140" width="131.25" height="24"/><rect x="516.25" y="140" width="78.75" height="24"/><rect x="595" y="140" width="131.25" height="24"/><rect x="726.25" y="140" width="183.75" height="24"/>
    </g>
    <text x="227" y="157" fill="#203035">imm[11:0]</text><text x="450" y="157" fill="#203035">rs1</text><text x="555" y="157" fill="#203035">f3</text><text x="660" y="157" fill="#203035">rd</text><text x="818" y="157" fill="#203035">opcode</text>
    <!-- S -->
    <text x="40" y="208" font-family="system-ui,sans-serif" font-size="13" font-weight="750" fill="#203035">S</text>
    <g stroke="#9c742c" stroke-width="1.5" fill="#fbf4dd">
      <rect x="70" y="192" width="183.75" height="24"/><rect x="253.75" y="192" width="131.25" height="24"/><rect x="385" y="192" width="131.25" height="24"/><rect x="516.25" y="192" width="78.75" height="24"/><rect x="595" y="192" width="131.25" height="24"/><rect x="726.25" y="192" width="183.75" height="24"/>
    </g>
    <text x="161" y="209" fill="#203035">imm[11:5]</text><text x="319" y="209" fill="#203035">rs2</text><text x="450" y="209" fill="#203035">rs1</text><text x="555" y="209" fill="#203035">f3</text><text x="660" y="209" fill="#203035">imm[4:0]</text><text x="818" y="209" fill="#203035">opcode</text>
    <!-- B -->
    <text x="40" y="260" font-family="system-ui,sans-serif" font-size="13" font-weight="750" fill="#203035">B</text>
    <g stroke="#c6674b" stroke-width="1.5" fill="#fdeee7">
      <rect x="70" y="244" width="183.75" height="24"/><rect x="253.75" y="244" width="131.25" height="24"/><rect x="385" y="244" width="131.25" height="24"/><rect x="516.25" y="244" width="78.75" height="24"/><rect x="595" y="244" width="131.25" height="24"/><rect x="726.25" y="244" width="183.75" height="24"/>
    </g>
    <text x="161" y="261" fill="#203035">imm[12,10:5]</text><text x="319" y="261" fill="#203035">rs2</text><text x="450" y="261" fill="#203035">rs1</text><text x="555" y="261" fill="#203035">f3</text><text x="660" y="261" fill="#203035">imm[4:1,11]</text><text x="818" y="261" fill="#203035">opcode</text>
    <!-- U -->
    <text x="40" y="312" font-family="system-ui,sans-serif" font-size="13" font-weight="750" fill="#203035">U</text>
    <g stroke="#147f80" stroke-width="1.5" fill="#e8f4ef">
      <rect x="70" y="296" width="525" height="24"/><rect x="595" y="296" width="131.25" height="24"/><rect x="726.25" y="296" width="183.75" height="24"/>
    </g>
    <text x="332" y="313" fill="#203035">imm[31:12]</text><text x="660" y="313" fill="#203035">rd</text><text x="818" y="313" fill="#203035">opcode</text>
    <!-- J -->
    <text x="40" y="364" font-family="system-ui,sans-serif" font-size="13" font-weight="750" fill="#203035">J</text>
    <g stroke="#7564b8" stroke-width="1.5" fill="#f1edfa">
      <rect x="70" y="348" width="525" height="24"/><rect x="595" y="348" width="131.25" height="24"/><rect x="726.25" y="348" width="183.75" height="24"/>
    </g>
    <text x="332" y="365" fill="#203035">imm[20,10:1,11,19:12]</text><text x="660" y="365" fill="#203035">rd</text><text x="818" y="365" fill="#203035">opcode</text>
  </g>
  <text x="40" y="410" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" fill="#203035">最右七位恒为 opcode；rd[11:7]、rs1[19:15]、rs2[24:20] 三种格式共用同一位置。</text>
  <text x="40" y="440" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13" fill="#203035">立即数在 S/B/J 型中按位散开，是 RISC-V 与变长 ISA 不同的“代价”，也是译码器需要单独拼接的部分。</text>
  <text x="40" y="478" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="12.5" fill="#566066">位域布局依 RISC-V 未特权指令集手册；本图只表达字段位置，不代替手册的编码定义。</text>
</svg>
