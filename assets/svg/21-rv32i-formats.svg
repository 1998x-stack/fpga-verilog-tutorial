<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="rvfmt-title rvfmt-desc"><title id="rvfmt-title">RV32I base instruction formats</title><desc id="rvfmt-desc">Six instruction formats R, I, S, B, U and J. Each row spans 32 bits from bit 31 to bit 0. Register fields stay at fixed positions while B and J immediate bits are rearranged.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">RV32I：寄存器字段固定，立即数按格式重组</text><text x="130" y="93" class="s">bit 31</text><text x="890" y="93" text-anchor="end" class="s">bit 0</text><text x="65" y="141" class="l">R</text><rect x="130" y="112" width="166" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="213" y="130" text-anchor="middle" class="s">funct7</text><text x="213" y="146" text-anchor="middle" class="xs">31:25</text><rect x="296" y="112" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="355.5" y="130" text-anchor="middle" class="s">rs2</text><text x="355.5" y="146" text-anchor="middle" class="xs">24:20</text><rect x="415" y="112" width="119" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="474.5" y="130" text-anchor="middle" class="s">rs1</text><text x="474.5" y="146" text-anchor="middle" class="xs">19:15</text><rect x="534" y="112" width="71" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="569.5" y="130" text-anchor="middle" class="s">funct3</text><text x="569.5" y="146" text-anchor="middle" class="xs">14:12</text><rect x="605" y="112" width="119" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="664.5" y="130" text-anchor="middle" class="s">rd</text><text x="664.5" y="146" text-anchor="middle" class="xs">11:7</text><rect x="724" y="112" width="166" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="807" y="130" text-anchor="middle" class="s">opcode</text><text x="807" y="146" text-anchor="middle" class="xs">6:0</text><text x="65" y="204" class="l">I</text><rect x="130" y="175" width="285" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="272.5" y="193" text-anchor="middle" class="s">imm[11:0]</text><text x="272.5" y="209" text-anchor="middle" class="xs">31:20</text><rect x="415" y="175" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="474.5" y="193" text-anchor="middle" class="s">rs1</text><text x="474.5" y="209" text-anchor="middle" class="xs">19:15</text><rect x="534" y="175" width="71" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="569.5" y="193" text-anchor="middle" class="s">funct3</text><text x="569.5" y="209" text-anchor="middle" class="xs">14:12</text><rect x="605" y="175" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="664.5" y="193" text-anchor="middle" class="s">rd</text><text x="664.5" y="209" text-anchor="middle" class="xs">11:7</text><rect x="724" y="175" width="166" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="807" y="193" text-anchor="middle" class="s">opcode</text><text x="807" y="209" text-anchor="middle" class="xs">6:0</text><text x="65" y="267" class="l">S</text><rect x="130" y="238" width="166" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="213" y="256" text-anchor="middle" class="s">imm[11:5]</text><text x="213" y="272" text-anchor="middle" class="xs">31:25</text><rect x="296" y="238" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="355.5" y="256" text-anchor="middle" class="s">rs2</text><text x="355.5" y="272" text-anchor="middle" class="xs">24:20</text><rect x="415" y="238" width="119" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="474.5" y="256" text-anchor="middle" class="s">rs1</text><text x="474.5" y="272" text-anchor="middle" class="xs">19:15</text><rect x="534" y="238" width="71" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="569.5" y="256" text-anchor="middle" class="s">funct3</text><text x="569.5" y="272" text-anchor="middle" class="xs">14:12</text><rect x="605" y="238" width="119" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="664.5" y="256" text-anchor="middle" class="s">imm[4:0]</text><text x="664.5" y="272" text-anchor="middle" class="xs">11:7</text><rect x="724" y="238" width="166" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="807" y="256" text-anchor="middle" class="s">opcode</text><text x="807" y="272" text-anchor="middle" class="xs">6:0</text><text x="65" y="330" class="l">B</text><rect x="130" y="301" width="166" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="213" y="319" text-anchor="middle" class="s">imm[12|10:5]</text><text x="213" y="335" text-anchor="middle" class="xs">31:25</text><rect x="296" y="301" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="355.5" y="319" text-anchor="middle" class="s">rs2</text><text x="355.5" y="335" text-anchor="middle" class="xs">24:20</text><rect x="415" y="301" width="119" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="474.5" y="319" text-anchor="middle" class="s">rs1</text><text x="474.5" y="335" text-anchor="middle" class="xs">19:15</text><rect x="534" y="301" width="71" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="569.5" y="319" text-anchor="middle" class="s">funct3</text><text x="569.5" y="335" text-anchor="middle" class="xs">14:12</text><rect x="605" y="301" width="119" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="664.5" y="319" text-anchor="middle" class="s">imm[4:1|11]</text><text x="664.5" y="335" text-anchor="middle" class="xs">11:7</text><rect x="724" y="301" width="166" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="807" y="319" text-anchor="middle" class="s">opcode</text><text x="807" y="335" text-anchor="middle" class="xs">6:0</text><text x="65" y="393" class="l">U</text><rect x="130" y="364" width="475" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="367.5" y="382" text-anchor="middle" class="s">imm[31:12]</text><text x="367.5" y="398" text-anchor="middle" class="xs">31:12</text><rect x="605" y="364" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="664.5" y="382" text-anchor="middle" class="s">rd</text><text x="664.5" y="398" text-anchor="middle" class="xs">11:7</text><rect x="724" y="364" width="166" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="807" y="382" text-anchor="middle" class="s">opcode</text><text x="807" y="398" text-anchor="middle" class="xs">6:0</text><text x="65" y="456" class="l">J</text><rect x="130" y="427" width="475" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="367.5" y="445" text-anchor="middle" class="s">imm[20|10:1|11|19:12]</text><text x="367.5" y="461" text-anchor="middle" class="xs">31:12</text><rect x="605" y="427" width="119" height="42" rx="5" fill="#eaf5f0" stroke="#43866b"/><text x="664.5" y="445" text-anchor="middle" class="s">rd</text><text x="664.5" y="461" text-anchor="middle" class="xs">11:7</text><rect x="724" y="427" width="166" height="42" rx="5" fill="#eef3fb" stroke="#5378a8"/><text x="807" y="445" text-anchor="middle" class="s">opcode</text><text x="807" y="461" text-anchor="middle" class="xs">6:0</text><rect x="55" y="495" width="850" height="30" rx="8" fill="#fff4e7" stroke="#c18a39"/><text x="480" y="516" text-anchor="middle" class="s">B/J 的低位偏移按 2-byte 单位编码；所有立即数的符号位来自 instruction[31]。</text></svg>
