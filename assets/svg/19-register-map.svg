<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="regmap-title regmap-desc"><title id="regmap-title">AXI4-Lite peripheral register map</title><desc id="regmap-desc">Four 32-bit registers at offsets 0x00, 0x04, 0x08, and 0x0C. CTRL and SCRATCH are read-write, STATUS and ID are read-only.</desc><style>.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.label{font:700 19px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><rect x="65" y="110" width="830" height="330" rx="16" fill="#fff" stroke="#d7ddd8" stroke-width="2"/><text x="105" y="155" class="head">32-bit AXI4-Lite · byte address offsets</text><rect x="105" y="185" width="180" height="55" rx="10" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="195" y="220" text-anchor="middle" class="label">0x00 · CTRL</text><rect x="325" y="185" width="505" height="55" rx="10" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="350" y="220" class="small" text-anchor="start">RW · WSTRB controls four byte lanes · led_o = [3:0]</text><rect x="105" y="255" width="180" height="55" rx="10" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="195" y="290" text-anchor="middle" class="label">0x04 · STATUS</text><rect x="325" y="255" width="505" height="55" rx="10" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="350" y="290" class="small" text-anchor="start">RO · sampled from status_i[31:0]</text><rect x="105" y="325" width="180" height="55" rx="10" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="195" y="360" text-anchor="middle" class="label">0x08 · SCRATCH</text><rect x="325" y="325" width="505" height="55" rx="10" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="350" y="360" class="small" text-anchor="start">RW · software read/write test register · WSTRB enabled</text><rect x="105" y="395" width="180" height="55" rx="10" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="195" y="430" text-anchor="middle" class="label">0x0C · ID</text><rect x="325" y="395" width="505" height="55" rx="10" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="350" y="430" class="small" text-anchor="start">RO · constant 0x46504741 (“FPGA”)</text><text x="480" y="495" text-anchor="middle" class="small">Unaligned or unmapped addresses return SLVERR; address range is 0x00–0x0F.</text></svg>
