<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="quality-title quality-desc"><title id="quality-title">Hardware acceptance criteria beyond compilation</title><desc id="quality-desc">Five evidence layers are syntax/lint, directed and random functional simulation, protocol and CDC checks, synthesis PPA, and physical/device signoff.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="44" y="48" font-size="27" font-weight="700" text-anchor="start" fill="#24373c">“能编译”只覆盖验证金字塔的最下层</text><rect x="55" y="100" width="850" height="65" rx="10" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="480" y="127" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">1 · Syntax &amp; lint</text><text x="480" y="151" font-size="13" font-weight="500" text-anchor="middle" fill="#586970">Can the RTL parse and elaborate?</text><rect x="105" y="178" width="750" height="65" rx="10" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="480" y="205" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">2 · Functional</text><text x="480" y="229" font-size="13" font-weight="500" text-anchor="middle" fill="#586970">Reference output + reset/edge cases</text><rect x="155" y="256" width="650" height="65" rx="10" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="480" y="283" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">3 · Protocol</text><text x="480" y="307" font-size="13" font-weight="500" text-anchor="middle" fill="#586970">VALID/READY, CDC, safety invariants</text><rect x="205" y="334" width="550" height="65" rx="10" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="480" y="361" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">4 · PPA</text><text x="480" y="385" font-size="13" font-weight="500" text-anchor="middle" fill="#586970">Mapped area, frequency, critical path</text><rect x="255" y="412" width="450" height="65" rx="10" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="480" y="439" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">5 · Device sign-off</text><text x="480" y="463" font-size="13" font-weight="500" text-anchor="middle" fill="#586970">Timing, power, board and integration</text><text x="480" y="512" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">每层都是不同的证据；一个测试通过不能替代上层测试。</text></svg>
