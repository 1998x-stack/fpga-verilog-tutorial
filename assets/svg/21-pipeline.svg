<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="pipeline-title pipeline-desc"><title id="pipeline-title">Five-stage RV32I pipeline</title><desc id="pipeline-desc">Instruction flows through IF, ID, EX, MEM and WB with four pipeline registers. Forwarding paths bypass newer results back to EX operands.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">五级流水线：每一级在时钟沿交接状态</text><rect x="40" y="150" width="150" height="120" rx="12" class="blue"/><text x="115" y="184" text-anchor="middle" class="l">IF</text><text x="115" y="218" text-anchor="middle" class="s">取指</text><text x="115" y="245" text-anchor="middle" class="xs">PC / IMEM</text><rect x="220" y="150" width="150" height="120" rx="12" class="green"/><text x="295" y="184" text-anchor="middle" class="l">ID</text><text x="295" y="218" text-anchor="middle" class="s">译码 / 读寄存器</text><text x="295" y="245" text-anchor="middle" class="xs">decode / RF</text><rect x="400" y="150" width="150" height="120" rx="12" class="orange"/><text x="475" y="184" text-anchor="middle" class="l">EX</text><text x="475" y="218" text-anchor="middle" class="s">执行 / 地址计算</text><text x="475" y="245" text-anchor="middle" class="xs">ALU / branch</text><rect x="580" y="150" width="150" height="120" rx="12" class="purple"/><text x="655" y="184" text-anchor="middle" class="l">MEM</text><text x="655" y="218" text-anchor="middle" class="s">数据访存</text><text x="655" y="245" text-anchor="middle" class="xs">DMEM</text><rect x="760" y="150" width="150" height="120" rx="12" class="blue"/><text x="835" y="184" text-anchor="middle" class="l">WB</text><text x="835" y="218" text-anchor="middle" class="s">写回</text><text x="835" y="245" text-anchor="middle" class="xs">RF write</text><rect x="202" y="130" width="14" height="160" rx="5" fill="#d9e4df" stroke="#7b928b"/><rect x="382" y="130" width="14" height="160" rx="5" fill="#d9e4df" stroke="#7b928b"/><rect x="562" y="130" width="14" height="160" rx="5" fill="#d9e4df" stroke="#7b928b"/><rect x="742" y="130" width="14" height="160" rx="5" fill="#d9e4df" stroke="#7b928b"/><path d="M190 210 H220 M370 210 H400 M550 210 H580 M730 210 H760" class="line"/><path d="M655 290 V370 H470 V290" stroke="#c18a39" stroke-width="3" fill="none"/><path d="M835 290 V410 H470 V290" stroke="#7b67a7" stroke-width="3" fill="none"/><text x="565" y="360" class="s">EX/MEM bypass</text><text x="620" y="400" class="s">MEM/WB bypass</text><rect x="40" y="445" width="880" height="54" rx="10" fill="#fff4e7" stroke="#c18a39"/><text x="480" y="478" text-anchor="middle" class="s">Load-use：数据尚未从 MEM 返回时冻结 PC 与 IF/ID，并向 ID/EX 注入 bubble。</text></svg>
