<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="b01t b01d"><title id="b01t">组合逻辑与触发器的输出因果关系</title><desc id="b01d">组合逻辑输出随输入在传播延迟后变化；触发器 Q 只在合法采样时钟沿更新为此前稳定的 D。</desc><defs><marker id="b01arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="46" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="start" font-weight="750">同一个输入 X，两个不同的“时间观”</text>
<rect x="50" y="100" width="394" height="316" rx="15" fill="#f8faf7" stroke="#c8d8d4" stroke-width="2"/><rect x="515" y="100" width="395" height="316" rx="15" fill="#f8faf7" stroke="#c8d8d4" stroke-width="2"/>
<text x="77" y="145" font-family="system-ui,sans-serif" font-size="24" fill="#147f80" text-anchor="start" font-weight="750">组合逻辑</text><text x="545" y="145" font-family="system-ui,sans-serif" font-size="24" fill="#d06d4d" text-anchor="start" font-weight="750">时序逻辑</text>
<rect x="168" y="195" width="166" height="96" rx="15" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="251" y="233" font-family="system-ui,sans-serif" font-size="27" fill="#147f80" text-anchor="middle" font-weight="800">f(X)</text><text x="251" y="263" font-family="system-ui,sans-serif" font-size="16" fill="#53676d" text-anchor="middle" font-weight="500">门电路</text>
<path d="M70 242H166" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b01arrow)"/><text x="72" y="217" font-family="system-ui,sans-serif" font-size="20" fill="#203035" text-anchor="start" font-weight="500">X</text><path d="M334 242H422" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b01arrow)"/><text x="408" y="221" font-family="system-ui,sans-serif" font-size="20" fill="#203035" text-anchor="start" font-weight="500">Y</text>
<text x="251" y="340" font-family="system-ui,sans-serif" font-size="17" fill="#53676d" text-anchor="middle" font-weight="500">Y = f(X)，受传播延迟影响</text>
<rect x="636" y="193" width="150" height="98" rx="15" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="710" y="231" font-family="system-ui,sans-serif" font-size="20" fill="#203035" text-anchor="middle" font-weight="750">D  FF  Q</text><text x="710" y="258" font-family="system-ui,sans-serif" font-size="16" fill="#d06d4d" text-anchor="middle" font-weight="500">↑ 时钟沿</text>
<path d="M537 241H633" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b01arrow)"/><text x="545" y="219" font-family="system-ui,sans-serif" font-size="20" fill="#203035" text-anchor="start" font-weight="500">D</text><path d="M787 241H884" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#b01arrow)"/><text x="871" y="220" font-family="system-ui,sans-serif" font-size="20" fill="#203035" text-anchor="start" font-weight="500">Q</text>
<path d="M709 366V292" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="724" y="365" font-family="system-ui,sans-serif" font-size="18" fill="#7461ba" text-anchor="start" font-weight="500">CLK</text><text x="710" y="398" font-family="system-ui,sans-serif" font-size="17" fill="#53676d" text-anchor="middle" font-weight="500">Q 在时钟沿之后变化</text>
<text x="43" y="463" font-family="system-ui,sans-serif" font-size="18" fill="#203035" text-anchor="start" font-weight="500">核心区别：组合逻辑没有“保存上一拍状态”的能力；触发器才有。</text>
</svg>
