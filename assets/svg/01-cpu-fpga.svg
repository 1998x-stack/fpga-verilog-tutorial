"2"/><text x="607" y="347" font-family="system-ui,sans-serif" font-size="16" fill="#203035" text-anchor="middle" font-weight="500">输入 C</text><path d="M662 340H702" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="701" y="314" width="85" height="53" rx="8" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="743" y="346" font-family="system-ui,sans-serif" font-size="18" fill="#147f80" text-anchor="middle" font-weight="700">LUT</text><path d="M786 340H816" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="815" y="314" width="79" height="53" rx="8" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="854" y="347" font-family="system-ui,sans-serif" font-size="19" fill="#d06d4d" text-anchor="middle" font-weight="700">FF</text>
<text x="718" y="415" font-family="system-ui,sans-serif" font-size="16" fill="#53676d" text-anchor="middle" font-weight="500">空间上并行，时钟沿写入状态</text>
<text x="50" y="464" font-family="system-ui,sans-serif" font-size="16" fill="#53676d" text-anchor="start" font-weight="500">注意：CPU 也有 SIMD/多核；这是一种计算组织方式的比较，而非性能排名。</text>
</svg>
