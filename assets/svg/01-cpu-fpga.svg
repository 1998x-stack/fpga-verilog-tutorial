<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="a01t a01d"><title id="a01t">CPU 指令流与 FPGA 空间并行电路</title><desc id="a01d">左侧单条指令轨道在处理器核心按步骤执行。右侧 FPGA 的不同功能单元在一个周期内并行组合计算并由触发器存储状态。</desc><defs><marker id="a01arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="45" y="45" font-family="system-ui,sans-serif" font-size="22" fill="#203035" text-anchor="start" font-weight="750">同一任务：同时处理三路输入</text>
<rect x="42" y="76" width="393" height="344" rx="15" fill="#f7f7f2" stroke="#c8d8d4" stroke-width="2"/><rect x="525" y="76" width="393" height="344" rx="15" fill="#f7f7f2" stroke="#c8d8d4" stroke-width="2"/>
<text x="72" y="117" font-family="system-ui,sans-serif" font-size="24" fill="#d06d4d" text-anchor="start" font-weight="700">CPU：指令序列</text><text x="552" y="117" font-family="system-ui,sans-serif" font-size="24" fill="#147f80" text-anchor="start" font-weight="700">FPGA：硬件数据通路</text>
<rect x="99" y="154" width="270" height="52" rx="9" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="234" y="188" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="500">加载通道 A，计算</text><path d="M234 209V227" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="99" y="232" width="270" height="52" rx="9" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="234" y="266" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="500">加载通道 B，计算</text><path d="M234 287V305" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="99" y="310" width="270" height="52" rx="9" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="234" y="344" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="500">加载通道 C，计算</text>
