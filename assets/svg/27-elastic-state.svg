<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="elastic-title elastic-desc"><title id="elastic-title">One entry ready valid elastic buffer state transition</title><desc id="elastic-desc">When empty it accepts input; when full and sink stalls it holds payload and valid; on simultaneous dequeue and enqueue it replaces the current payload.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="43" y="50" font-size="26" font-weight="700" text-anchor="start" fill="#24373c">单级弹性寄存器：既不丢包，也不重复消费</text><rect x="60" y="160" width="285" height="115" rx="13" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="202.5" y="197" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">EMPTY (full = 0)</text><text x="202.5" y="228" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">s_ready = 1</text><rect x="620" y="160" width="285" height="115" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="762.5" y="197" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">FULL (full = 1)</text><text x="762.5" y="228" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">m_valid = 1</text><path d="M345 208 L620 208" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="478" y="185" font-size="15" font-weight="500" text-anchor="middle" fill="#3f7779">input handshake</text><path d="M620 245 H345" stroke="#c28a3b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="483" y="271" font-size="15" font-weight="500" text-anchor="middle" fill="#95672d">output only</text><rect x="320" y="353" width="320" height="103" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="480" y="390" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">FULL + both handshake</text><text x="480" y="421" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">Replace old with new</text><path d="M760 275 L600 353" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="480" y="492" font-size="15" font-weight="500" text-anchor="middle" fill="#52666b">s_ready = !full || m_ready；full &amp;&amp; !m_ready 时必须保持 data 和 valid。</text></svg>
