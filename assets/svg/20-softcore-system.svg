<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="softcore-title softcore-desc"><title id="softcore-title">软核 SoC 的控制、存储和数据通路</title><desc id="softcore-desc">MicroBlaze V 通过 LMB 访问本地 BRAM，通过 AXI 连接内存映射外设和流式加速器。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">软核 SoC 的控制、存储和数据通路</text><rect x="365" y="55" width="230" height="110" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="480" y="85" text-anchor="middle" class="label">MicroBlaze V</text><text x="480" y="111" text-anchor="middle" class="small">RISC-V soft processor</text><rect x="40" y="250" width="230" height="100" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="155" y="280" text-anchor="middle" class="label">ILMB / DLMB</text><text x="155" y="306" text-anchor="middle" class="small">Instruction / Data BRAM</text><rect x="365" y="250" width="230" height="100" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="480" y="280" text-anchor="middle" class="label">AXI interconnect</text><text x="480" y="306" text-anchor="middle" class="small">Address decode / routing</text><rect x="690" y="145" width="230" height="90" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="805" y="175" text-anchor="middle" class="label">AXI4-Lite peripherals</text><text x="805" y="201" text-anchor="middle" class="small">GPIO / UART / custom IP</text><rect x="690" y="315" width="230" height="90" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="805" y="345" text-anchor="middle" class="label">AXI4-Stream engine</text><text x="805" y="371" text-anchor="middle" class="small">FIR / packet / image</text><path d="M480 165 L480 250" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="198.5" text-anchor="middle" class="tiny">M_AXI / LMB</text><path d="M365 300 L270 300" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="317.5" y="291" text-anchor="middle" class="tiny">LMB</text><path d="M595 280 L690 190" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="642.5" y="226" text-anchor="middle" class="tiny">AXI-MM</text><path d="M595 320 L690 360" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="642.5" y="331" text-anchor="middle" class="tiny">AXI-Stream</text><path d="M805 235 V270 H620 V105 H595" fill="none" stroke="#c18a39" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="715" y="275" text-anchor="middle" class="tiny">IRQ / status</text><text x="480" y="475" text-anchor="middle" class="small">CPU 控制外设；专用 RTL 承担高吞吐数据路径。</text></svg>
