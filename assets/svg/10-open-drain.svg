<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="10opendraint 10opendraind"><title id="10opendraint">I2C 开漏线与上拉电阻</title><desc id="10opendraind">多个器件只能主动下拉总线或释放；上拉提供逻辑高。任一驱动拉低时，SDA/SCL 为低。纯内部 FPGA 逻辑不应把三态误当成 LUT 原语。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="38" y="44" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">任何一方拉低，总线就为低；高电平来自上拉</text>
<text x="460" y="86" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="20" fill="#c86d4f">VDD</text><path d="M460 99V137" fill="none" stroke="#c86d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="428" y="136" width="64" height="84" rx="7" fill="#fcf3dc" stroke="#956d25" stroke-width="2"/><text x="460" y="169" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="25" fill="#956d25">R</text><text x="460" y="193" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="12" fill="#956d25">pull-up</text>
<path d="M460 220V273H841" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M460 273H131" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="810" y="252" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="20" fill="#147f80">SDA</text>
<path d="M159 273V330" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="70" y="333" width="176" height="94" rx="10" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="159" y="366" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="18" fill="#203035">控制器 A</text><text x="159" y="398" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#53676d">drive_low / release</text><path d="M444 273V330" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="355" y="333" width="176" height="94" rx="10" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><text x="444" y="366" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="18" fill="#203035">目标设备 B</text><text x="444" y="398" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#53676d">drive_low / release</text><path d="M729 273V330" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="640" y="333" width="176" height="94" rx="10" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/><text x="729" y="366" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="18" fill="#203035">目标设备 C</text><text x="729" y="398" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#53676d">drive_low / release</text>
