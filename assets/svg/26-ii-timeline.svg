<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="iitimeline-title iitimeline-desc"><title id="iitimeline-title">Pipeline initiation interval and latency schedule</title><desc id="iitimeline-desc">Four-stage pipeline has one new sample beginning each cycle, latency four cycles and initiation interval one, assuming no stalls; these are different measures.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="45" y="48" font-size="25" font-weight="700" text-anchor="start" fill="#24373c">同一条硬件流水线：Latency = 4，II = 1（理想例子）</text><text x="235" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C1</text><text x="318" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C2</text><text x="401" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C3</text><text x="484" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C4</text><text x="567" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C5</text><text x="650" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C6</text><text x="733" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C7</text><text x="816" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#58676d">C8</text><text x="90" y="164" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">S0</text><text x="90" y="236" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">S1</text><text x="90" y="308" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">S2</text><text x="90" y="380" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">S3</text><rect x="198" y="133" width="72" height="49" rx="7" fill="#eef4fc" stroke="#587ba8"/><text x="234" y="164" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x0</text><rect x="281" y="133" width="72" height="49" rx="7" fill="#eaf5ef" stroke="#3d886d"/><text x="317" y="164" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x1</text><rect x="364" y="133" width="72" height="49" rx="7" fill="#fff3e3" stroke="#c28a3b"/><text x="400" y="164" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x2</text><rect x="447" y="133" width="72" height="49" rx="7" fill="#f3effb" stroke="#7c67b5"/><text x="483" y="164" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x3</text><rect x="281" y="205" width="72" height="49" rx="7" fill="#eef4fc" stroke="#587ba8"/><text x="317" y="236" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x0</text><rect x="364" y="205" width="72" height="49" rx="7" fill="#eaf5ef" stroke="#3d886d"/><text x="400" y="236" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x1</text><rect x="447" y="205" width="72" height="49" rx="7" fill="#fff3e3" stroke="#c28a3b"/><text x="483" y="236" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x2</text><rect x="530" y="205" width="72" height="49" rx="7" fill="#f3effb" stroke="#7c67b5"/><text x="566" y="236" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x3</text><rect x="364" y="277" width="72" height="49" rx="7" fill="#eef4fc" stroke="#587ba8"/><text x="400" y="308" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x0</text><rect x="447" y="277" width="72" height="49" rx="7" fill="#eaf5ef" stroke="#3d886d"/><text x="483" y="308" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x1</text><rect x="530" y="277" width="72" height="49" rx="7" fill="#fff3e3" stroke="#c28a3b"/><text x="566" y="308" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x2</text><rect x="613" y="277" width="72" height="49" rx="7" fill="#f3effb" stroke="#7c67b5"/><text x="649" y="308" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x3</text><rect x="447" y="349" width="72" height="49" rx="7" fill="#eef4fc" stroke="#587ba8"/><text x="483" y="380" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x0</text><rect x="530" y="349" width="72" height="49" rx="7" fill="#eaf5ef" stroke="#3d886d"/><text x="566" y="380" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x1</text><rect x="613" y="349" width="72" height="49" rx="7" fill="#fff3e3" stroke="#c28a3b"/><text x="649" y="380" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x2</text><rect x="696" y="349" width="72" height="49" rx="7" fill="#f3effb" stroke="#7c67b5"/><text x="732" y="380" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">x3</text><text x="75" y="472" font-size="15" font-weight="500" text-anchor="start" fill="#24373c">每个 x 都经过 4 级；新 x 每个周期可以进入 S0。真实 II 仍受依赖、存储端口和 backpressure 限制。</text></svg>
