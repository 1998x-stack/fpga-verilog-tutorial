<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="axi5-title axi5-desc"><title id="axi5-title">AXI4 的五个独立单向通道</title><desc id="axi5-desc">Manager 与 Subordinate 通过 AW、W、B、AR、R 五条独立通道完成读写事务。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">AXI4 的五个独立单向通道</text><rect x="40" y="180" width="190" height="140" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="135" y="210" text-anchor="middle" class="label">Manager</text><text x="135" y="236" text-anchor="middle" class="small">发起事务</text><rect x="730" y="180" width="190" height="140" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="825" y="210" text-anchor="middle" class="label">Subordinate</text><text x="825" y="236" text-anchor="middle" class="small">接受 / 响应</text><path d="M230 195 L730 195" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="186" text-anchor="middle" class="tiny">AW · 写地址</text><path d="M230 235 L730 235" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="226" text-anchor="middle" class="tiny">W · 写数据</text><path d="M730 275 L230 275" fill="none" stroke="#c18a39" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="266" text-anchor="middle" class="tiny">B · 写响应</text><path d="M230 315 L730 315" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="306" text-anchor="middle" class="tiny">AR · 读地址</text><path d="M730 355 L230 355" fill="none" stroke="#c18a39" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="346" text-anchor="middle" class="tiny">R · 读数据</text><text x="480" y="115" text-anchor="middle" class="label">每个通道独立进行 VALID / READY 握手</text><text x="480" y="445" text-anchor="middle" class="small">AW 与 W 可以先后到达；B 必须对应已接受的写事务。</text></svg>
