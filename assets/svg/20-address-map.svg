<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="addressmap-title addressmap-desc"><title id="addressmap-title">地址映射把软件指针变成硬件事务</title><desc id="addressmap-desc">处理器发出地址，互连按地址窗口选择一个外设；每个窗口的范围必须不重叠。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">地址映射把软件指针变成硬件事务</text><rect x="55" y="120" width="250" height="310" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="180" y="150" text-anchor="middle" class="label">Processor address space</text><text x="180" y="176" text-anchor="middle" class="small">32-bit example</text><rect x="365" y="120" width="535" height="70" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="632.5" y="150" text-anchor="middle" class="label">BRAM / code + data</text><text x="632.5" y="176" text-anchor="middle" class="small">0x0000_0000 — 0x0001_FFFF</text><rect x="365" y="215" width="535" height="55" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="632.5" y="245" text-anchor="middle" class="label">UART</text><text x="632.5" y="271" text-anchor="middle" class="small">0x4000_0000 — 0x4000_0FFF</text><rect x="365" y="290" width="535" height="55" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="632.5" y="320" text-anchor="middle" class="label">GPIO</text><text x="632.5" y="346" text-anchor="middle" class="small">0x4001_0000 — 0x4001_0FFF</text><rect x="365" y="365" width="535" height="65" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="632.5" y="395" text-anchor="middle" class="label">Custom AXI-Lite registers</text><text x="632.5" y="421" text-anchor="middle" class="small">0x44A0_0000 — 0x44A0_0FFF</text><text x="480" y="485" text-anchor="middle" class="small">以上地址只是示意；实际基地址来自 Address Editor / XSA / xparameters.h。</text></svg>
