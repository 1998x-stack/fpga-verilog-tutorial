<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="reprobuild-title reprobuild-desc"><title id="reprobuild-title">构建结果必须能追溯到完整输入集合</title><desc id="reprobuild-desc">源代码、器件、工具版本、约束、IP 配置和实现种子共同决定一次构建。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">构建结果必须能追溯到完整输入集合</text><rect x="35" y="130" width="200" height="90" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="135" y="160" text-anchor="middle" class="label">Git commit</text><text x="135" y="186" text-anchor="middle" class="small">源码 / testbench</text><rect x="270" y="130" width="200" height="90" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="370" y="160" text-anchor="middle" class="label">Target</text><text x="370" y="186" text-anchor="middle" class="small">family / part / board rev</text><rect x="505" y="130" width="200" height="90" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="605" y="160" text-anchor="middle" class="label">Toolchain</text><text x="605" y="186" text-anchor="middle" class="small">Quartus / Vivado version</text><rect x="740" y="130" width="185" height="90" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="832.5" y="160" text-anchor="middle" class="label">Constraints + IP</text><text x="832.5" y="186" text-anchor="middle" class="small">SDC / QSF / versions</text><path d="M135 220 L420 330" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M370 220 L450 330" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M605 220 L510 330" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M830 220 L550 330" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><rect x="325" y="330" width="310" height="90" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="480" y="360" text-anchor="middle" class="label">Build pipeline</text><text x="480" y="386" text-anchor="middle" class="small">compile → fit / route → STA</text><path d="M480 420 L480 455" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="490" text-anchor="middle" class="label">manifest.json + reports + artifact checksum</text></svg>
