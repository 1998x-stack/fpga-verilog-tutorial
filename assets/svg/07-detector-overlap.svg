<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="07detectoroverlapt 07detectoroverlapd"><title id="07detectoroverlapt">101 序列检测器的重叠检测</title><desc id="07detectoroverlapd">状态 S0 未匹配、S1 最近匹配 1、S10 最近匹配 10；输入 101 后输出 match 一周期，并回到前缀 1 以支持 10101 重叠检测。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="43" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">目标序列：101 · 允许重叠匹配</text>
<circle cx="172" cy="212" r="31" fill="#fffdf9" stroke="#147f80" stroke-width="3"/><text x="172" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="18" fill="#147f80">S0</text><circle cx="481" cy="212" r="31" fill="#fffdf9" stroke="#147f80" stroke-width="3"/><text x="481" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="18" fill="#147f80">S1</text><circle cx="790" cy="212" r="31" fill="#fffdf9" stroke="#147f80" stroke-width="3"/><text x="790" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="18" fill="#147f80">S10</text>
<path d="M205 212H448" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="328" y="192" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#147f80">1 / 输出 0</text>
<path d="M514 212H756" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="636" y="192" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#147f80">0 / 输出 0</text>
<path d="M790 245V354H480V246" fill="none" stroke="#c86d4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="637" y="379" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="18" fill="#c86d4f">1 / match=1 → S1</text>
<path d="M757 229L209 304L172 244" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="485" y="320" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#7461ba">0 / 无匹配 → S0</text>
<path d="M153 182Q128 105 177 123Q215 138 192 183" fill="none" stroke="#956d25" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="148" y="101" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#956d25">0 → S0</text>
<text x="39" y="450" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">S1 输入 1 留在 S1（仍有后缀 1）。状态定义采用 Mealy 输出 match。</text>
<path d="M466 186Q435 118 483 126Q528 120 495 187" fill="none" stroke="#916c22" stroke-width="3" stroke-linecap="round"/><text x="482" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="650" fill="#916c22">1 → S1</text></svg>
