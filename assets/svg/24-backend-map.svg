<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="backendmap-title backendmap-desc"><title id="backendmap-title">nextpnr backend support map</title><desc id="backendmap-desc">The current nextpnr README lists iCE40, ECP5, Nexus, Gowin, NanoXplore NG-Ultra and GateMate backends. Nexus, Cyclone V, MachXO2 and Xilinx 7-Series are experimental; NG-Ultra P&R requires proprietary Impulse for bitstream generation.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}</style><rect width="960" height="560" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">nextpnr 当前后端支持与实验性状态</text><rect x="70" y="92" width="820" height="36" rx="7" class="green"/><text x="95" y="116" class="l" style="font-size:14px">Lattice iCE40</text><text x="465" y="116" class="s">Project IceStorm</text><text x="720" y="116" class="s">supported</text><rect x="70" y="136" width="820" height="36" rx="7" class="green"/><text x="95" y="160" class="l" style="font-size:14px">Lattice ECP5</text><text x="465" y="160" class="s">Project Trellis</text><text x="720" y="160" class="s">supported</text><rect x="70" y="180" width="820" height="36" rx="7" class="green"/><text x="95" y="204" class="l" style="font-size:14px">Lattice Nexus</text><text x="465" y="204" class="s">Project Oxide</text><text x="720" y="204" class="s">experimental / alpha</text><rect x="70" y="224" width="820" height="36" rx="7" class="green"/><text x="95" y="248" class="l" style="font-size:14px">Gowin LittleBee / Aurora V</text><text x="465" y="248" class="s">Project Apicula</text><text x="720" y="248" class="s">supported</text><rect x="70" y="268" width="820" height="36" rx="7" class="green"/><text x="95" y="292" class="l" style="font-size:14px">NanoXplore NG-Ultra</text><text x="465" y="292" class="s">Project Beyond</text><text x="720" y="292" class="s">P&amp;R; Impulse for bitstream</text><rect x="70" y="312" width="820" height="36" rx="7" class="green"/><text x="95" y="336" class="l" style="font-size:14px">Cologne Chip GateMate</text><text x="465" y="336" class="s">Project Peppercorn</text><text x="720" y="336" class="s">supported</text><rect x="70" y="356" width="820" height="36" rx="7" class="orange"/><text x="95" y="380" class="l" style="font-size:14px">Intel Cyclone V</text><text x="465" y="380" class="s">Mistral</text><text x="720" y="380" class="s">experimental</text><rect x="70" y="400" width="820" height="36" rx="7" class="orange"/><text x="95" y="424" class="l" style="font-size:14px">Lattice MachXO2</text><text x="465" y="424" class="s">Project Trellis</text><text x="720" y="424" class="s">experimental</text><rect x="70" y="444" width="820" height="36" rx="7" class="orange"/><text x="95" y="468" class="l" style="font-size:14px">Xilinx 7-Series</text><text x="465" y="468" class="s">Project X-Ray</text><text x="720" y="468" class="s">experimental</text><text x="480" y="530" text-anchor="middle" class="s">此表以 2026-11 上游 README 为准；不代表每个 part、封装、PLL、SerDes 或 IP 均已覆盖。</text></svg>
