<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="backendmap-title backendmap-desc"><title id="backendmap-title">nextpnr backend support map</title><desc id="backendmap-desc">The nextpnr project lists stable family backends and explicitly marks experimental backends; Xilinx 7-series is experimental in the current README.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">nextpnr 的支持矩阵必须带上“实验性”标签</text><rect x="70" y="105" width="820" height="48" rx="8" class="green"/><text x="95" y="135" class="l" style="font-size:15px">Lattice iCE40</text><text x="430" y="135" class="s">Project IceStorm</text><text x="700" y="135" class="s">documented backend</text><rect x="70" y="165" width="820" height="48" rx="8" class="green"/><text x="95" y="195" class="l" style="font-size:15px">Lattice ECP5</text><text x="430" y="195" class="s">Project Trellis</text><text x="700" y="195" class="s">documented backend</text><rect x="70" y="225" width="820" height="48" rx="8" class="green"/><text x="95" y="255" class="l" style="font-size:15px">Lattice Nexus</text><text x="430" y="255" class="s">Project Oxide</text><text x="700" y="255" class="s">documented backend</text><rect x="70" y="285" width="820" height="48" rx="8" class="green"/><text x="95" y="315" class="l" style="font-size:15px">Gowin LittleBee / Aurora V</text><text x="430" y="315" class="s">Project Apicula</text><text x="700" y="315" class="s">documented backend</text><rect x="70" y="345" width="820" height="48" rx="8" class="orange"/><text x="95" y="375" class="l" style="font-size:15px">Xilinx 7-Series</text><text x="430" y="375" class="s">Project X-Ray</text><text x="700" y="375" class="s">experimental in upstream README</text><rect x="70" y="405" width="820" height="48" rx="8" class="orange"/><text x="95" y="435" class="l" style="font-size:15px">Intel Cyclone V</text><text x="430" y="435" class="s">Mistral</text><text x="700" y="435" class="s">experimental in upstream README</text><text x="480" y="495" text-anchor="middle" class="s">此表描述上游项目 README 的当前声明，不等于所有器件型号、IP、PLL 或完整 SoC 均可实现。</text></svg>
