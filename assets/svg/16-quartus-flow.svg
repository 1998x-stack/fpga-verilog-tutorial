<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="qflow-title qflow-desc"><title id="qflow-title">Quartus 编译不是单一按钮</title><desc id="qflow-desc">RTL、QSF 与 SDC 输入 Quartus Compiler；综合、Fitter、时序分析、Assembler 各自产生不同证据。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">Quartus 编译不是单一按钮</text><rect x="35" y="145" width="135" height="110" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="102.5" y="175" text-anchor="middle" class="label">RTL + IP</text><text x="102.5" y="201" text-anchor="middle" class="small">Verilog / VHDL</text><rect x="35" y="295" width="135" height="100" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="102.5" y="325" text-anchor="middle" class="label">QSF + SDC</text><text x="102.5" y="351" text-anchor="middle" class="small">器件 / 管脚 / 时钟</text><rect x="210" y="145" width="150" height="110" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="285" y="175" text-anchor="middle" class="label">Analysis &amp;</text><text x="285" y="201" text-anchor="middle" class="small">Synthesis</text><rect x="400" y="145" width="135" height="110" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="467.5" y="175" text-anchor="middle" class="label">Fitter</text><text x="467.5" y="201" text-anchor="middle" class="small">布局与布线</text><rect x="575" y="145" width="145" height="110" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="647.5" y="175" text-anchor="middle" class="label">TimeQuest</text><text x="647.5" y="201" text-anchor="middle" class="small">STA 检查</text><rect x="760" y="145" width="165" height="110" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="842.5" y="175" text-anchor="middle" class="label">Assembler</text><text x="842.5" y="201" text-anchor="middle" class="small">配置文件</text><path d="M170 195 L210 195" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M360 195 L400 195" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M535 195 L575 195" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 195 L760 195" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><path d="M170 345 L640 260" fill="none" stroke="#c18a39" stroke-width="3" marker-end="url(#arrow)"/><text x="405" y="293.5" text-anchor="middle" class="tiny">时序约束 / SDC</text><text x="842" y="290" text-anchor="middle" class="small">.sof 等配置产物</text><path d="M842 255 L842 282" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="475" y="440" text-anchor="middle" class="label">编译成功 ≠ 时序通过 ≠ 板卡验证通过</text></svg>
