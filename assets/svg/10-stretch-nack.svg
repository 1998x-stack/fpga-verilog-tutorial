<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="10stretchnackt 10stretchnackd"><title id="10stretchnackt">区分 I2C 时钟拉伸与 EEPROM 写周期 NACK</title><desc id="10stretchnackd">两种不同问题：拉伸时目标设备保持 SCL 低；24LC256 写周期忙时通常不 ACK 地址，控制器应做 ACK polling，而不是假设 SDA/SCL 均被拉低。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="42" y="42" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">两种常见现象，不应混为一谈</text>
<rect x="43" y="92" width="418" height="285" rx="13" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><rect x="505" y="92" width="414" height="285" rx="13" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/>
<text x="250" y="139" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#7461ba">Clock stretching</text><text x="712" y="139" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#c86d4f">24LC256 写周期</text>
<text x="251" y="186" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">控制器 release SCL</text><text x="251" y="223" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">目标仍把 SCL 拉低</text><text x="251" y="259" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#7461ba">等待实际 SCL 变高</text>
<text x="712" y="186" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">控制器发送地址</text><text x="712" y="223" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">EEPROM 忙时回 NACK</text><text x="712" y="259" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="17" fill="#c86d4f">通过 ACK polling 查询</text>
<text x="251" y="346" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">观察：SCL 电平</text><text x="713" y="346" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">观察：第 9 位 SDA</text>
<text x="44" y="445" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">两者均要定义 timeout / 失败策略，但排错和恢复机制不同。</text>
</svg>
