<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="07fsmtransitionst 07fsmtransitionsd"><title id="07fsmtransitionst">状态机：状态、输入与输出之间的关系</title><desc id="07fsmtransitionsd">状态寄存器在 clk 上升沿采样 next_state；组合逻辑根据当前状态与输入确定下一状态，输出可只依赖状态或还依赖输入。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="45" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">状态寄存器与转移逻辑组成闭环</text>
<rect x="43" y="116" width="236" height="189" rx="13" fill="#e7f3ef" stroke="#147f80" stroke-width="2"/><text x="161" y="158" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#147f80">组合转移逻辑</text><text x="161" y="202" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#203035">next = f(state, input)</text>
<rect x="376" y="116" width="223" height="189" rx="13" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><text x="487" y="158" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#7461ba">状态寄存器</text><text x="487" y="205" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#203035">posedge clk</text>
<rect x="697" y="116" width="223" height="189" rx="13" fill="#fce9df" stroke="#c86d4f" stroke-width="2"/><text x="808" y="154" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="22" fill="#c86d4f">输出逻辑</text><text x="808" y="199" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">Moore: g(state)</text><text x="808" y="232" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">Mealy: h(state, in)</text>
<path d="M279 206H375" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M599 206H696" fill="none" stroke="#7461ba" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<path d="M480 308V371H160V310" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="274" y="391" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#7461ba">state 反馈</text>
<path d="M40 96H100V113" fill="none" stroke="#956d25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="87" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="18" fill="#956d25">input</text>
<text x="34" y="460" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">Moore 依赖当前状态，不代表必须“晚一拍”；输出译码也可能出现暂态毛刺。</text>
</svg>
