<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="sc20t sc20d">
  <title id="sc20t">硬核处理器与软核处理器的资源来源对比</title>
  <desc id="sc20d">左侧硬核处理器是器件上固定的硅片区域，不占用可编程逻辑，性能由工艺决定且微架构不可改；右侧软核处理器由查找表、触发器与块存储构成，占用可编程逻辑，可按配置裁剪并可扩展接口，性能取决于配置与器件。两者都通过 AXI 总线连接用户 RTL 与内存。</desc>
  <rect width="960" height="480" fill="#fffdf9"/>
  <text x="40" y="42" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="22" font-weight="750" fill="#203035">固定硅片 vs 可重配置逻辑</text>
  <g font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif">
    <rect x="50" y="80" width="400" height="300" rx="14" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/>
    <text x="250" y="114" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">硬核处理器</text>
    <rect x="90" y="134" width="320" height="120" rx="10" fill="#ffffff" stroke="#7564b8" stroke-width="1.5"/>
    <text x="250" y="176" font-size="15" text-anchor="middle" fill="#203035">固定的硅区域</text>
    <text x="250" y="202" font-size="13" text-anchor="middle" fill="#566066">微架构不可改</text>
    <text x="250" y="226" font-size="13" text-anchor="middle" fill="#566066">不占用可编程逻辑</text>
    <text x="250" y="300" font-size="13.5" text-anchor="middle" fill="#203035">适合：逻辑资源紧张、需稳定算力</text>
    <text x="250" y="326" font-size="13.5" text-anchor="middle" fill="#203035">代价：不可裁剪、不可扩展指令</text>

    <rect x="510" y="80" width="400" height="300" rx="14" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/>
    <text x="710" y="114" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">软核处理器</text>
    <rect x="550" y="134" width="320" height="120" rx="10" fill="#ffffff" stroke="#147f80" stroke-width="1.5"/>
    <text x="710" y="176" font-size="15" text-anchor="middle" fill="#203035">LUT + FF + BRAM</text>
    <text x="710" y="202" font-size="13" text-anchor="middle" fill="#566066">占用可编程逻辑</text>
    <text x="710" y="226" font-size="13" text-anchor="middle" fill="#566066">可按配置裁剪 / 扩展接口</text>
    <text x="710" y="300" font-size="13.5" text-anchor="middle" fill="#203035">适合：控制流复杂、需与 RTL 紧耦合</text>
    <text x="710" y="326" font-size="13.5" text-anchor="middle" fill="#203035">代价：与加速器争逻辑资源</text>

    <path d="M450 230H510" stroke="#c6674b" stroke-width="3" fill="none"/>
    <text x="480" y="222" font-size="12" text-anchor="middle" fill="#c6674b">都是</text>
    <text x="480" y="252" font-size="12" text-anchor="middle" fill="#c6674b">CPU</text>
  </g>
  <text x="480" y="420" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="13.5" text-anchor="middle" fill="#566066">两者的资源与频率都取决于具体器件、速度等级与配置，不能脱离这些前提比较。</text>
</svg>
