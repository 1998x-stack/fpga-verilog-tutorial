<text x="250" y="432" font-family="system-ui,sans-serif" font-size="17" fill="#916c22" text-anchor="middle" font-weight="500">边沿 A：低</text><text x="651" y="432" font-family="system-ui,sans-serif" font-size="17" fill="#916c22" text-anchor="middle" font-weight="500">边沿 B：低</text>
<text x="480" y="180" font-family="system-ui,sans-serif" font-size="16" fill="#147f80" text-anchor="middle" font-weight="500">两段短脉冲发生于边沿之间</text>
<text x="484" y="480" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">此例 count 保持不变；仅靠“发生毛刺”不足以推断同步计数器会多计数。</text>
</svg>
