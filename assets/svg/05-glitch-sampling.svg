<path d="M145 134H252V83H330V134H646V83H720V134H906" fill="none" stroke="#7461ba" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M145 252H384V194H417V252H495V194H531V252H905" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M145 368H906" fill="none" stroke="#d06d4d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
