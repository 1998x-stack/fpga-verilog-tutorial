<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="firdp-title firdp-desc"><title id="firdp-title">Four tap stateful FIR datapath</title><desc id="firdp-desc">Input sample and three delayed values are weighted 1,2,2,1, accumulated in 32 bits and divided by six; reset clears history, not a specified hardware pin.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="45" y="50" font-size="26" font-weight="700" text-anchor="start" fill="#24373c">FIR4：状态决定运算含义，位宽决定结果是否正确</text><rect x="45" y="112" width="220" height="74" rx="13" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="155" y="149" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">x[n]</text><text x="155" y="180" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">×1</text><rect x="45" y="205" width="220" height="74" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="155" y="242" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">z⁻¹: x[n−1]</text><text x="155" y="273" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">×2</text><rect x="45" y="298" width="220" height="74" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="155" y="335" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">z⁻²: x[n−2]</text><text x="155" y="366" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">×2</text><rect x="45" y="391" width="220" height="74" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="155" y="428" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">z⁻³: x[n−3]</text><text x="155" y="459" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">×1</text><path d="M265 150 L445 270" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M265 243 L445 270" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M265 336 L445 270" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M265 429 L445 270" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="445" y="220" width="210" height="100" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="550" y="257" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">32-bit sum</text><text x="550" y="288" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">signed accumulator</text><path d="M655 270 L710 270" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="710" y="220" width="200" height="100" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="810" y="257" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Divide by 6</text><text x="810" y="288" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">truncate to int16</text><text x="480" y="500" font-size="15" font-weight="500" text-anchor="middle" fill="#52666b">若系数或状态更新顺序改动，输出序列也会改变；C-sim 与参考模型必须逐样本比较。</text></svg>
