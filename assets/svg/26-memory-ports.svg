<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="memports-title memports-desc"><title id="memports-title">HLS memory ports limit parallel data accesses</title><desc id="memports-desc">A dual-port memory cannot directly sustain four independent reads every clock; array banking or partitioning may create additional ports at area cost.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="45" y="50" font-size="24" font-weight="700" text-anchor="start" fill="#24373c">一次迭代 4 次读：双端口 RAM 不能凭空提供 4 个读端口</text><rect x="55" y="140" width="330" height="120" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="220" y="177" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Without partition</text><text x="220" y="208" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">2 ports · 4 requested reads</text><rect x="575" y="140" width="330" height="120" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="740" y="177" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Banked / partitioned</text><text x="740" y="208" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">4 independent read banks</text><path d="M385 200 L575 200" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="595" y="300" width="60" height="80" rx="8" fill="#eef4fc" stroke="#587ba8"/><text x="625" y="339" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">B0</text><text x="625" y="360" font-size="13" font-weight="500" text-anchor="middle" fill="#24373c">1 rd</text><rect x="665" y="300" width="60" height="80" rx="8" fill="#eef4fc" stroke="#587ba8"/><text x="695" y="339" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">B1</text><text x="695" y="360" font-size="13" font-weight="500" text-anchor="middle" fill="#24373c">1 rd</text><rect x="735" y="300" width="60" height="80" rx="8" fill="#eef4fc" stroke="#587ba8"/><text x="765" y="339" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">B2</text><text x="765" y="360" font-size="13" font-weight="500" text-anchor="middle" fill="#24373c">1 rd</text><rect x="805" y="300" width="60" height="80" rx="8" fill="#eef4fc" stroke="#587ba8"/><text x="835" y="339" font-size="16" font-weight="700" text-anchor="middle" fill="#24373c">B3</text><text x="835" y="360" font-size="13" font-weight="500" text-anchor="middle" fill="#24373c">1 rd</text><text x="214" y="327" font-size="16" font-weight="500" text-anchor="middle" fill="#24373c">Read A, B, C, D compete</text><text x="214" y="358" font-size="15" font-weight="500" text-anchor="middle" fill="#a15b29">schedule can raise II</text><text x="480" y="470" font-size="15" font-weight="500" text-anchor="middle" fill="#52666b">Partitioning changes physical storage and wiring; verify BRAM/LUT, congestion and achieved II.</text></svg>
