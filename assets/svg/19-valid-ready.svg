<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="axi-handshake-title axi-handshake-desc"><title id="axi-handshake-title">一次握手只发生在 VALID 与 READY 同时为高的上升沿</title><desc id="axi-handshake-desc">VALID 拉高后保持；payload 维持稳定，直到 READY 与 VALID 在采样沿同时为高。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">一次握手只发生在 VALID 与 READY 同时为高的上升沿</text><text x="70" y="140" text-anchor="start" class="small">CLK</text><text x="70" y="220" text-anchor="start" class="small">VALID</text><text x="70" y="305" text-anchor="start" class="small">READY</text><text x="70" y="390" text-anchor="start" class="small">PAYLOAD</text><path d="M155 130 H900 M155 155 V130 H225 V155 H295 V130 H365 V155 H435 V130 H505 V155 H575 V130 H645 V155 H715 V130 H785 V155 H855 V130 H900" stroke="#20343a" stroke-width="3" fill="none"/><path d="M155 235 H225 V200 H575 V235 H900" stroke="#147f80" stroke-width="4" fill="none"/><path d="M155 320 H365 V285 H715 V320 H900" stroke="#c18a39" stroke-width="4" fill="none"/><path d="M155 405 H225 V370 H575 V405 H900" stroke="#5378a8" stroke-width="4" fill="none"/><rect x="505" y="175" width="16" height="250" fill="#e7d7b7" opacity=".65"/><text x="513" y="175" text-anchor="middle" class="tiny">TRANSFER</text><text x="400" y="350" text-anchor="middle" class="tiny">payload 保持不变</text><text x="480" y="480" text-anchor="middle" class="small">READY=0 的周期是 backpressure，不是丢弃 VALID 的理由。</text></svg>
