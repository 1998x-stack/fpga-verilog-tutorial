<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="09uartframet 09uartframed"><title id="09uartframet">UART 8N1 逐位帧结构</title><desc id="09uartframed">空闲线为 1，一位起始位为 0，随后 8 个 LSB-first 数据位，再一个停止位为 1；每一位中心作为采样参考点。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="39" y="42" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">UART 8N1 · 8 数据位 / 无校验 / 1 停止位</text>
<text x="42" y="92" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="19" fill="#203035">TX</text>
<path d="M105 117H187V271H275V117H363V271H451V117H539V271H627V117H715V271H803V117H913" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
<path d="M100 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M187 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M275 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M363 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M451 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M539 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M627 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M715 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M803 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><path d="M891 100V300" fill="none" stroke="#c9d8d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<text x="143" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#53676d">idle</text><text x="231" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="800" font-size="14" fill="#c86d4f">START</text><text x="319" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D0</text><text x="407" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D1</text><text x="495" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D2</text><text x="583" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D3</text><text x="671" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D4</text><text x="759" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D5</text><text x="847" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D6</text><text x="935" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="600" font-size="14" fill="#203035">D7</text><text x="903" y="329" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="13" fill="#53676d">STOP</text>
<path d="M231 348V376 M319 348V376 M407 348V376 M495 348V376 M583 348V376 M671 348V376 M759 348V376 M847 348V376" fill="none" stroke="#c86d4f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="490" y="408" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="17" fill="#203035">采样参考：各数据位中心；起始位半位确认后，每隔一位采样一次。</text>
<text x="44" y="464" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">图是帧位序示意，实际 TX 电平序列取决于发送的数据字节。</text>
</svg>
