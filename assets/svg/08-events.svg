<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="08eventst 08eventsd"><title id="08eventst">时钟上升沿和 NBA 更新的测试台采样</title><desc id="08eventsd">DUT 在上升沿计算 RHS，NBA 稍后写寄存器，测试台在下一个下降沿检查稳定值，避免与 DUT 同时更新产生竞态。</desc><rect width="960" height="490" fill="#fffdf9"/>
<text x="42" y="48" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="750" font-size="23" fill="#203035">在明确采样点检查稳定结果</text>
