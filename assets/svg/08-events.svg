<text x="730" y="421" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#c86d4f">下降沿：检查稳定值</text>
<text x="41" y="473" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif" font-weight="500" font-size="16" fill="#53676d">实际调度还有更多事件区域；图仅示意避免 race 的基础测试策略。</text>
