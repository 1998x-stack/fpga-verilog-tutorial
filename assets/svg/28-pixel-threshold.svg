<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="pixelstage-title pixelstage-desc"><title id="pixelstage-title">RGB to weighted grayscale and threshold stage</title><desc id="pixelstage-desc">The 24-bit RGB input is multiplied by 77,150,29, rounded with 128 and shifted eight bits, then compared to an 8-bit threshold to produce 0 or 255 with preserved markers.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#498084"/></marker></defs><rect x="0" y="0" width="960" height="540" rx="18" fill="#fffdf9"/><text x="43" y="48" font-size="25" font-weight="700" text-anchor="start" fill="#24373c">一像素的可测试路径：RGB888 → Gray8 → Binary8</text><rect x="45" y="180" width="180" height="110" rx="13" fill="#eef4fc" stroke="#587ba8" stroke-width="2"/><text x="135" y="217" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">RGB888</text><text x="135" y="248" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">R · G · B (8b each)</text><path d="M225 235 L282 235" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="282" y="180" width="220" height="110" rx="13" fill="#fff3e3" stroke="#c28a3b" stroke-width="2"/><text x="392" y="217" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Weighted gray</text><text x="392" y="248" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">(77R+150G+29B+128)&gt;&gt;8</text><path d="M502 235 L552 235" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="552" y="180" width="160" height="110" rx="13" fill="#f3effb" stroke="#7c67b5" stroke-width="2"/><text x="632" y="217" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Compare</text><text x="632" y="248" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">gray ≥ threshold</text><path d="M712 235 L760 235" stroke="#498084" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="760" y="180" width="155" height="110" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="837.5" y="217" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">Binary8</text><text x="837.5" y="248" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">00 or FF</text><rect x="170" y="358" width="620" height="83" rx="13" fill="#eaf5ef" stroke="#3d886d" stroke-width="2"/><text x="480" y="395" font-size="17" font-weight="700" text-anchor="middle" fill="#24373c">TUSER / TLAST are registered with the pixel</text><text x="480" y="426" font-size="14" font-weight="500" text-anchor="middle" fill="#52666b">All output fields remain stable while VALID &amp;&amp; !READY</text><text x="480" y="493" font-size="15" font-weight="500" text-anchor="middle" fill="#52666b">This stage is not a Sobel filter, line buffer, camera receiver, or DDR subsystem.</text></svg>
