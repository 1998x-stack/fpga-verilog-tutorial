<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="13grayskewt 13grayskewd"><title id="13grayskewt">Gray 指针相邻编码只改变一位但仍需布线约束</title><desc id="13grayskewd">三位二进制序列0 1 2 3 4与其Gray编码000 001 011 010 110对照。发送端逻辑只一次翻一位，跨域总线各线延迟不同仍可能在接收端看到非相邻值。</desc><rect width="960" height="500" fill="#fffdf9"/>
<text x="36" y="44" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="750" text-anchor="start" fill="#203035">相邻 Gray 字只变一位；物理路径仍需限制偏斜</text>
<text x="154" y="130" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="#58686e">Binary</text><text x="286" y="130" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">000</text><text x="418" y="130" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">001</text><text x="550" y="130" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">010</text><text x="682" y="130" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">011</text><text x="814" y="130" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">100</text>
<rect x="101" y="172" width="106" height="81" rx="9" fill="#f1edfa" stroke="#7564b8" stroke-width="2"/><text x="154" y="220" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="800" text-anchor="middle" fill="#7564b8">Gray</text><rect x="233" y="172" width="106" height="81" rx="9" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="286" y="220" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="800" text-anchor="middle" fill="#147f80">000</text><rect x="365" y="172" width="106" height="81" rx="9" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="418" y="220" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="800" text-anchor="middle" fill="#147f80">001</text><rect x="497" y="172" width="106" height="81" rx="9" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="550" y="220" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="800" text-anchor="middle" fill="#147f80">011</text><rect x="629" y="172" width="106" height="81" rx="9" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="682" y="220" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="800" text-anchor="middle" fill="#147f80">010</text><rect x="761" y="172" width="106" height="81" rx="9" fill="#e8f4ef" stroke="#147f80" stroke-width="2"/><text x="814" y="220" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="23" font-weight="800" text-anchor="middle" fill="#147f80">110</text>
<rect x="63" y="306" width="833" height="118" rx="14" fill="#fbeae3" stroke="#c6674b" stroke-width="2"/><text x="479" y="349" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#c6674b">同一次写指针变化的每条 bit 路径可能具有不同布线延迟</text><text x="479" y="384" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#203035">需要对 Gray 总线采用适合目标工具的 max_delay / bus_skew 约束</text>
<text x="40" y="469" font-family="system-ui,'Noto Sans CJK SC','PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#58686e">跨域空满判定还需要正确的指针同步、翻转位和容量逻辑；一幅图无法代替完整 FIFO 验证。</text>
</svg>
