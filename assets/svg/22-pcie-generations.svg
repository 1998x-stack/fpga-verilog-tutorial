<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="pciegen-title pciegen-desc"><title id="pciegen-title">PCIe generations and line coding</title><desc id="pciegen-desc">PCIe Gen1 and Gen2 use 8b/10b; Gen3 to Gen5 use 128b/130b NRZ; Gen6 introduces PAM4, FLIT mode, FEC and CRC.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">不要把 PCIe Gen5 与 Gen6 的物理层混为一谈</text><rect x="70" y="110" width="820" height="100" rx="14" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="105" y="145" class="l">Gen1 / Gen2</text><text x="350" y="145" class="l">2.5 / 5 GT/s</text><text x="600" y="145" class="l">NRZ · 8b/10b</text><text x="105" y="180" class="s">80% code efficiency</text><rect x="70" y="235" width="820" height="100" rx="14" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="105" y="270" class="l">Gen3 / Gen4 / Gen5</text><text x="350" y="270" class="l">8 / 16 / 32 GT/s</text><text x="600" y="270" class="l">NRZ · 128b/130b</text><text x="105" y="305" class="s">128/130 before protocol overhead</text><rect x="70" y="360" width="820" height="100" rx="14" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="105" y="395" class="l">Gen6</text><text x="350" y="395" class="l">64 GT/s</text><text x="600" y="395" class="l">PAM4 · FLIT · FEC + CRC</text><text x="105" y="430" class="s">two bits per symbol</text><text x="480" y="510" text-anchor="middle" class="s">GT/s 是传输速率单位；NRZ 下每次传输承载 1 bit，PAM4 每个符号承载 2 bit。</text></svg>
