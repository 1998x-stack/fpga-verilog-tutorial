<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="setuppath-title setuppath-desc"><title id="setuppath-title">Register-to-register setup timing path</title><desc id="setuppath-desc">A launch register launches data through combinational logic to a capture register. Setup slack includes period, capture-minus-launch skew, uncertainty, setup time and data delay.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">Setup：数据必须在 capture edge 前稳定</text><rect x="65" y="175" width="175" height="100" rx="12" class="blue"/><text x="152" y="215" text-anchor="middle" class="l">Launch FF</text><text x="152" y="245" text-anchor="middle" class="s">Q changes</text><rect x="380" y="175" width="205" height="100" rx="12" class="orange"/><text x="482" y="215" text-anchor="middle" class="l">Combinational</text><text x="482" y="245" text-anchor="middle" class="s">logic + routing</text><rect x="725" y="175" width="175" height="100" rx="12" class="green"/><text x="812" y="215" text-anchor="middle" class="l">Capture FF</text><text x="812" y="245" text-anchor="middle" class="s">D must settle</text><path d="M240 225 H380 M585 225 H725" class="line"/><path d="M150 120 H810" stroke="#5378a8" stroke-width="3"/><path d="M150 120 V160 M810 120 V160" stroke="#5378a8" stroke-width="3"/><text x="480" y="105" text-anchor="middle" class="s">Clock period T + capture/launch skew</text><rect x="100" y="350" width="760" height="95" rx="12" class="purple"/><text x="480" y="390" text-anchor="middle" class="l">Simplified setup slack</text><text x="480" y="422" text-anchor="middle" class="s">T + (capture clock − launch clock) − uncertainty − setup − data-path delay</text><text x="480" y="490" text-anchor="middle" class="s">Hold 使用 min-delay 分析；不能把 setup 修复手段直接套用到 hold。</text></svg>
