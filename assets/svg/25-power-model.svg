<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="powermodel-title powermodel-desc"><title id="powermodel-title">FPGA power components and activity model</title><desc id="powermodel-desc">Dynamic power depends on switching activity, effective capacitance, voltage squared and frequency. Static leakage, clock, IO and transceiver power must also be considered.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">功耗模型：活动率和电容是输入，不是“固定占比”</text><rect x="65" y="115" width="400" height="145" rx="14" class="blue"/><text x="265" y="155" text-anchor="middle" class="l">Dynamic power</text><text x="265" y="200" text-anchor="middle" class="h">P ≈ α · C · V² · f</text><text x="265" y="232" text-anchor="middle" class="s">switching activity · capacitance · voltage · frequency</text><rect x="515" y="115" width="380" height="145" rx="14" class="orange"/><text x="705" y="155" text-anchor="middle" class="l">Static / leakage</text><text x="705" y="200" text-anchor="middle" class="s">process · device state · junction temperature</text><text x="705" y="232" text-anchor="middle" class="s">not eliminated by reducing RTL toggle rate</text><rect x="65" y="330" width="255" height="95" rx="12" class="green"/><text x="192" y="370" text-anchor="middle" class="l" style="font-size:15px">Clock network</text><text x="192" y="400" text-anchor="middle" class="xs">clock buffers / register clock pins</text><rect x="350" y="330" width="255" height="95" rx="12" class="purple"/><text x="477" y="370" text-anchor="middle" class="l" style="font-size:15px">I/O</text><text x="477" y="400" text-anchor="middle" class="xs">load, termination, swing, activity</text><rect x="635" y="330" width="255" height="95" rx="12" class="orange"/><text x="762" y="370" text-anchor="middle" class="l" style="font-size:15px">Transceivers</text><text x="762" y="400" text-anchor="middle" class="xs">PLL, TX/RX, equalization, line rate</text><text x="480" y="490" text-anchor="middle" class="s">工具报告依赖器件、实现网表、活动文件、供电和热环境；toy calculator 只验证公式量纲。</text></svg>
