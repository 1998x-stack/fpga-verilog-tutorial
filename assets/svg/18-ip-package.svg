<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ip-title ip-desc"><title id="ip-title">IP Core packaging contract</title><desc id="ip-desc">RTL, interface metadata, parameters, constraints and example tests are packaged as a versioned IP component and published to a reusable catalog.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#467e7e"/></marker></defs><style>.h{font:700 24px Inter,'Noto Sans SC',sans-serif;fill:#20343a}.l{font:700 18px Inter,'Noto Sans SC',sans-serif;fill:#20343a}.s{font:500 15px Inter,'Noto Sans SC',sans-serif;fill:#52656b}</style><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">IP Core = HDL + machine-readable interface contract</text><rect x="45" y="110" width="250" height="250" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="170" y="148" text-anchor="middle" class="l">IP inputs</text><text x="72" y="195" class="s">• RTL / top-level HDL</text><text x="72" y="232" class="s">• Bus interface metadata</text><text x="72" y="269" class="s">• Parameters / address block</text><text x="72" y="306" class="s">• Clock / reset / constraints</text><text x="72" y="343" class="s">• Example design / tests</text><path d="M295 235 H380" stroke="#467e7e" stroke-width="3" marker-end="url(#a)"/><rect x="385" y="150" width="190" height="170" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="480" y="190" text-anchor="middle" class="l">IP Packager</text><text x="480" y="232" text-anchor="middle" class="s">Validate interfaces</text><text x="480" y="260" text-anchor="middle" class="s">Set VLNV / version</text><text x="480" y="288" text-anchor="middle" class="s">Package dependencies</text><path d="M575 235 H660" stroke="#467e7e" stroke-width="3" marker-end="url(#a)"/><rect x="665" y="110" width="250" height="250" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="790" y="148" text-anchor="middle" class="l">Reusable IP catalog</text><text x="695" y="195" class="s">Vendor : Library : Name</text><text x="695" y="232" class="s">Version / compatibility</text><text x="695" y="269" class="s">Parameters / interfaces</text><text x="695" y="306" class="s">Clock / reset association</text><text x="695" y="343" class="s">Consumer block design</text><text x="480" y="440" text-anchor="middle" class="s">A module that compiles is not automatically a correctly packaged, connectable IP.</text></svg>
