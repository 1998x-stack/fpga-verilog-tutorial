<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="timequest-title timequest-desc"><title id="timequest-title">寄存器到寄存器路径的时序预算</title><desc id="timequest-desc">同一时钟域中，launch FF 发射数据，经组合逻辑到 capture FF；Setup 关注晚到，Hold 关注早到。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">寄存器到寄存器路径的时序预算</text><rect x="55" y="185" width="175" height="115" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="142.5" y="215" text-anchor="middle" class="label">Launch FF</text><text x="142.5" y="241" text-anchor="middle" class="small">clk-to-Q</text><rect x="385" y="185" width="190" height="115" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="480" y="215" text-anchor="middle" class="label">组合逻辑</text><text x="480" y="241" text-anchor="middle" class="small">最大 / 最小延迟</text><rect x="730" y="185" width="175" height="115" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="817.5" y="215" text-anchor="middle" class="label">Capture FF</text><text x="817.5" y="241" text-anchor="middle" class="small">setup / hold</text><path d="M230 240 L385 240" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="307.5" y="231" text-anchor="middle" class="tiny">Tcq + D</text><path d="M575 240 L730 240" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="652.5" y="231" text-anchor="middle" class="tiny">到达数据</text><path d="M145 125 L145 175" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="141" text-anchor="middle" class="tiny">时钟沿</text><path d="M820 125 L820 175" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="820" y="141" text-anchor="middle" class="tiny">捕获沿</text><path d="M145 120 H820" stroke="#7b67a7" stroke-width="2" stroke-dasharray="7 6" fill="none"/><text x="480" y="95" text-anchor="middle" class="#7b67a7">一个时钟周期 T</text><rect x="150" y="365" width="270" height="75" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="285" y="395" text-anchor="middle" class="label">Setup</text><text x="285" y="421" text-anchor="middle" class="small">最晚数据必须赶上捕获沿</text><rect x="535" y="365" width="270" height="75" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="670" y="395" text-anchor="middle" class="label">Hold</text><text x="670" y="421" text-anchor="middle" class="small">最早数据不能过早穿过</text><text x="480" y="485" text-anchor="middle" class="small">真实报告还包含 skew、uncertainty、corner 与 I/O 约束。</text></svg>
