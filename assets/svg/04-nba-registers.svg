<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="d01t d01d"><title id="d01t">同一个时钟沿，非阻塞赋值采样旧值</title><desc id="d01d">两个时钟触发寄存器：q1&lt;=din，q2&lt;=q1，在同一个时钟沿右侧同时采样旧 q1；更新后 q1 得到 din，q2 得到先前 q1。</desc><defs><marker id="d01arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="43" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="start" font-weight="750">非阻塞赋值保留“上一拍”因果关系</text>
<rect x="47" y="97" width="405" height="318" rx="15" fill="#f7faf8" stroke="#c8d8d4" stroke-width="2"/><rect x="504" y="97" width="407" height="318" rx="15" fill="#fbf7f5" stroke="#c8d8d4" stroke-width="2"/>
<text x="78" y="139" font-family="system-ui,sans-serif" font-size="24" fill="#147f80" text-anchor="start" font-weight="750">边沿前</text><text x="536" y="139" font-family="system-ui,sans-serif" font-size="24" fill="#d06d4d" text-anchor="start" font-weight="750">边沿后</text>
<rect x="71" y="181" width="114" height="36" rx="8" fill="#fffdf9" stroke="#147f80" stroke-width="2"/><text x="128" y="205" font-family="system-ui,sans-serif" font-size="15" fill="#147f80" text-anchor="middle" font-weight="700">din = 1</text><rect x="71" y="278" width="114" height="36" rx="8" fill="#fffdf9" stroke="#7461ba" stroke-width="2"/><text x="128" y="302" font-family="system-ui,sans-serif" font-size="15" fill="#7461ba" text-anchor="middle" font-weight="700">q1 = 0</text>
<rect x="239" y="181" width="173" height="135" rx="12" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="325" y="220" font-family="system-ui,sans-serif" font-size="19" fill="#147f80" text-anchor="middle" font-weight="750">采样 RHS</text><text x="325" y="254" font-family="system-ui,sans-serif" font-size="18" fill="#203035" text-anchor="middle" font-weight="500">q1 ← din</text><text x="325" y="285" font-family="system-ui,sans-serif" font-size="18" fill="#203035" text-anchor="middle" font-weight="500">q2 ← 旧 q1</text>
<path d="M452 252H503" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d01arrow)"/>
<rect x="535" y="178" width="341" height="66" rx="12" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="700" y="219" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="700">q1 = 1（来自 din）</text>
<rect x="535" y="265" width="341" height="66" rx="12" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="700" y="306" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="700">q2 = 0（旧 q1）</text>
<text x="495" y="399" font-family="system-ui,sans-serif" font-size="16" fill="#53676d" text-anchor="middle" font-weight="500">注：示例展示一个有效采样沿；下一沿 q2 才会得到 1。</text>
<text x="44" y="461" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="start" font-weight="500">不要把非阻塞赋值理解为“多等一个周期再执行”——每条语句在同一时间步计算右值。</text>
</svg>
