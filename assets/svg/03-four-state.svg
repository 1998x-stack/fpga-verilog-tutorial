<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="c02t c02d"><title id="c02t">Verilog 四态取值与物理意义</title><desc id="c02d">0、1、X、Z 是 Verilog 仿真值；X 表示未知/冲突，Z 表示高阻。不是 FPGA LUT 中的四种稳定逻辑电平。</desc><defs><marker id="c02arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="40" y="46" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="start" font-weight="750">四态仿真不是四态硅逻辑</text>
<rect x="36" y="111" width="216" height="268" rx="18" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="144" y="201" font-family="system-ui,sans-serif" font-size="68" fill="#147f80" text-anchor="middle" font-weight="800">0</text><text x="144" y="250" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="700">逻辑低电平</text><text x="144" y="295" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">电路逻辑 0</text><rect x="268" y="111" width="216" height="268" rx="18" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="376" y="201" font-family="system-ui,sans-serif" font-size="68" fill="#147f80" text-anchor="middle" font-weight="800">1</text><text x="376" y="250" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="700">逻辑高电平</text><text x="376" y="295" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">电路逻辑 1</text><rect x="500" y="111" width="216" height="268" rx="18" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="608" y="201" font-family="system-ui,sans-serif" font-size="68" fill="#d06d4d" text-anchor="middle" font-weight="800">X</text><text x="608" y="250" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="700">未知 / 冲突</text><text x="608" y="295" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">未初始化或驱动不一致</text><rect x="732" y="111" width="216" height="268" rx="18" fill="#f1eef8" stroke="#7461ba" stroke-width="2"/><text x="840" y="201" font-family="system-ui,sans-serif" font-size="68" fill="#7461ba" text-anchor="middle" font-weight="800">Z</text><text x="840" y="250" font-family="system-ui,sans-serif" font-size="19" fill="#203035" text-anchor="middle" font-weight="700">高阻态</text><text x="840" y="295" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">三态总线模型；内部通常不保留</text>
<text x="46" y="439" font-family="system-ui,sans-serif" font-size="18" fill="#53676d" text-anchor="start" font-weight="500">例：4'b10xz 仅是仿真向量；综合工具对 X/Z 的处理与目标和代码上下文有关。</text>
</svg>
