<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="d02t d02d"><title id="d02t">简化的 Verilog 事件调度次序</title><desc id="d02d">同一个仿真时间戳中，时钟沿触发活动事件计算右值，NBA 区批量提交更新，最后观测稳定结果；不展开全部标准调度区域。</desc><defs><marker id="d02arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><rect width="960" height="490" fill="#fffdf9"/>
<text x="41" y="45" font-family="system-ui,sans-serif" font-size="23" fill="#203035" text-anchor="start" font-weight="750">同一个时间戳，多个调度阶段</text>
<rect x="30" y="113" width="213" height="232" rx="13" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="136" y="164" font-family="system-ui,sans-serif" font-size="22" fill="#203035" text-anchor="middle" font-weight="750">时钟沿触发</text><text x="136" y="213" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">posedge clk</text><text x="136" y="253" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">进入事件调度</text><path d="M244 228H263" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d02arrow)"/><rect x="264" y="113" width="213" height="232" rx="13" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="370" y="164" font-family="system-ui,sans-serif" font-size="22" fill="#203035" text-anchor="middle" font-weight="750">Active 区</text><text x="370" y="213" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">求 RHS 旧值</text><text x="370" y="253" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">执行阻塞赋值</text><path d="M478 228H497" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d02arrow)"/><rect x="498" y="113" width="213" height="232" rx="13" fill="#e5f2ee" stroke="#147f80" stroke-width="2"/><text x="604" y="164" font-family="system-ui,sans-serif" font-size="22" fill="#203035" text-anchor="middle" font-weight="750">NBA 更新</text><text x="604" y="213" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">提交非阻塞 LHS</text><text x="604" y="253" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">q1 / q2 一起更新</text><path d="M712 228H731" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d02arrow)"/><rect x="732" y="113" width="213" height="232" rx="13" fill="#fce8df" stroke="#d06d4d" stroke-width="2"/><text x="838" y="164" font-family="system-ui,sans-serif" font-size="22" fill="#203035" text-anchor="middle" font-weight="750">稳定后观察</text><text x="838" y="213" font-family="system-ui,sans-serif" font-size="17" fill="#203035" text-anchor="middle" font-weight="500">检查最终状态</text><text x="838" y="253" font-family="system-ui,sans-serif" font-size="15" fill="#53676d" text-anchor="middle" font-weight="500">避免测试台竞态</text>
<path d="M50 392H911" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="475" y="426" font-family="system-ui,sans-serif" font-size="18" fill="#7461ba" text-anchor="middle" font-weight="500">这里所有框都处于同一个仿真时间 t；不是四个真实硬件时钟周期。</text>
</svg>
