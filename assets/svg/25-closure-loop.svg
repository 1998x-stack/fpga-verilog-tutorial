<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="closureloop-title closureloop-desc"><title id="closureloop-title">Timing closure iterative workflow</title><desc id="closureloop-desc">Correct constraints precede critical-path analysis. Diagnose data path, clock path, and exceptions before selecting an RTL or physical fix.</desc><style>.h{font:700 25px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.l{font:700 17px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.s{font:500 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.xs{font:500 12px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.blue{fill:#eef3fb;stroke:#5378a8}.green{fill:#eaf5f0;stroke:#43866b}.orange{fill:#fff4e7;stroke:#c18a39}.purple{fill:#f3f0fb;stroke:#7b67a7}.line{stroke:#467e7e;stroke-width:3;fill:none}</style><rect width="960" height="540" rx="18" fill="#fffdf9"/><text x="42" y="48" class="h">时序收敛不是“多跑几次策略”，而是可追踪的闭环</text><rect x="45" y="120" width="255" height="105" rx="12" class="blue"/><text x="73" y="160" class="l">1</text><text x="110" y="160" class="l" style="font-size:15px">Validate constraints</text><rect x="345" y="120" width="255" height="105" rx="12" class="blue"/><text x="373" y="160" class="l">2</text><text x="410" y="160" class="l" style="font-size:15px">Read timing summary</text><rect x="645" y="120" width="255" height="105" rx="12" class="blue"/><text x="673" y="160" class="l">3</text><text x="710" y="160" class="l" style="font-size:15px">Inspect worst paths</text><rect x="45" y="310" width="255" height="105" rx="12" class="orange"/><text x="73" y="350" class="l">4</text><text x="110" y="350" class="l" style="font-size:15px">Classify root cause</text><rect x="345" y="310" width="255" height="105" rx="12" class="purple"/><text x="373" y="350" class="l">5</text><text x="410" y="350" class="l" style="font-size:15px">Apply one fix</text><rect x="645" y="310" width="255" height="105" rx="12" class="blue"/><text x="673" y="350" class="l">6</text><text x="710" y="350" class="l" style="font-size:15px">Re-implement / compare</text><path d="M300 172 H345 M600 172 H645 M775 225 V285 M645 338 H600 M345 338 H300" class="line"/><path d="M45 338 H20 V172 H45" stroke="#467e7e" stroke-width="3" fill="none"/><text x="480" y="510" text-anchor="middle" class="s">同一器件、工具版本、约束与 seed 才能做有意义的 A/B 比较；不要用 false path 隐藏真实路径。</text></svg>
