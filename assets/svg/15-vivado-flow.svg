<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="15vivadoflowt 15vivadoflowd"><title id="15vivadoflowt">Vivado 非工程模式 RTL到Bitstream的流水线</title><desc id="15vivadoflowd">read RTL和XDC，再综合、优化、布局、布线、STA/DRC和Bitstream；每个阶段产生可归档的报告和检查点；没有目标板卡pin和IO约束不能宣称完成可上板比特流。</desc><rect width="960" height="500" fill="#fffdf9"/>
