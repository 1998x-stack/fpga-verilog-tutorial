<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="tbarch-title tbarch-desc"><title id="tbarch-title">Testbench 是一个闭环验证系统</title><desc id="tbarch-desc">Driver 产生事务，DUT 响应，Monitor 采集事务，Scoreboard 与独立参考模型比较。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#467e7e"/></marker><style>.label{font:700 20px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.small{font:500 16px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#52656b}.tiny{font:600 14px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#8b5e22}.head{font:700 24px Inter,'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#20343a}.mono{font:600 16px ui-monospace,Consolas,monospace;fill:#20343a}</style></defs><rect width="960" height="520" rx="18" fill="#fffdf9"/><text x="42" y="48" class="head">Testbench 是一个闭环验证系统</text><rect x="50" y="175" width="180" height="110" rx="15" fill="#eef3fb" stroke="#5378a8" stroke-width="2"/><text x="140" y="205" text-anchor="middle" class="label">Driver</text><text x="140" y="231" text-anchor="middle" class="small">合法激励 / 背压</text><rect x="390" y="175" width="180" height="110" rx="15" fill="#eaf5f0" stroke="#43866b" stroke-width="2"/><text x="480" y="205" text-anchor="middle" class="label">DUT</text><text x="480" y="231" text-anchor="middle" class="small">被测 RTL</text><rect x="730" y="175" width="180" height="110" rx="15" fill="#fff4e7" stroke="#c18a39" stroke-width="2"/><text x="820" y="205" text-anchor="middle" class="label">Monitor</text><text x="820" y="231" text-anchor="middle" class="small">采样握手 / 输出</text><path d="M230 230 L390 230" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="221" text-anchor="middle" class="tiny">激励</text><path d="M570 230 L730 230" fill="none" stroke="#467e7e" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="221" text-anchor="middle" class="tiny">接口事件</text><rect x="370" y="370" width="220" height="90" rx="15" fill="#f3f0fb" stroke="#7b67a7" stroke-width="2"/><text x="480" y="400" text-anchor="middle" class="label">Scoreboard</text><text x="480" y="426" text-anchor="middle" class="small">期望值队列 / 比较</text><path d="M820 285 L590 410" fill="none" stroke="#7b67a7" stroke-width="3" marker-end="url(#arrow)"/><text x="705" y="338.5" text-anchor="middle" class="tiny">观测事务</text><path d="M480 370 L480 290" fill="none" stroke="#7b67a7" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="321" text-anchor="middle" class="tiny">参考结果</text><text x="480" y="500" text-anchor="middle" class="small">Testbench 的时钟、复位、超时和断言共同定义测试契约。</text></svg>
