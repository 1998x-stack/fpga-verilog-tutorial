name: Content + RTL checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static HTML, SVG and link checks
        run: python3 scripts/check_site.py
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Self-checking Verilog regression (17 testbenches)
        run: bash scripts/run_rtl_tests.sh
      - name: Python unit tests (STA, SerDes, frame budget and manifests)
        run: python3 -m unittest discover -s tests -v
      - name: Portable FIR4 C++ reference (not HLS synthesis)
        run: make -C examples/hls/fir4 test
      - name: Quartus project template contract (no Quartus installed)
        run: python3 scripts/check_quartus_example.py
      - name: Vivado Tcl source contract (no Vivado installed)
        run: python3 scripts/check_vivado_example.py
      - name: Open-source iCEstick flow contract (no FPGA tools installed)
        run: python3 scripts/check_open_source_example.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Desktop/mobile Playwright acceptance
        run: python3 scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-browser-screenshots
          path: qa/screens/
          if-no-files-found: ignore
